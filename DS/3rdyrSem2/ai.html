const PARTB_BANK = [
  {id:'b1',qnum:1,label:'Q1',
   a:{q:'(a) Explain BFS, DFS, UCS, and IDDFS with comparison.',opts:['BFS: queue, complete, optimal (equal cost), O(b^d) space. DFS: stack, incomplete, O(bm) space. UCS: priority queue, optimal (any cost). IDDFS: combines BFS completeness + DFS space O(bd).','All search strategies are equivalent','BFS is always the best choice','DFS is optimal for all problems'],ans:0,explain:'BFS: FIFO queue, explores level by level. Complete + optimal (equal costs). Space O(b^d)—problem. DFS: LIFO stack, explores depth first. Incomplete (infinite loops), not optimal. Space O(bm)—efficient. UCS: expand cheapest g(n), optimal for any costs. IDDFS: DFS with depth limit 0,1,2... Space O(bd), complete+optimal. Best for unknown depths.',wrongs:['They differ significantly in completeness, optimality, and complexity','Different problems warrant different strategies','IDDFS is often better for unknown depths']},
   b:{q:'(b) Explain A* search. When is it optimal? Compare with greedy.',opts:['A*: f=g+h. Optimal when h is admissible (never overestimates). Greedy: only h(n), fast but not optimal. A* finds optimal path; greedy finds fast path.','A* is never optimal','Greedy always finds optimal path','A* and greedy are identical'],ans:0,explain:'A* evaluation: f(n)=g(n)+h(n). g(n)=actual cost from start, h(n)=heuristic to goal. Optimal if: h admissible (h(n)≤h*(n)). Consistent h → closed nodes never reopened → efficient. Greedy: only h(n), may take longer paths. A*: balances path cost + heuristic → optimal+efficient with good h.',wrongs:['A* is optimal with admissible h','Greedy is not optimal','They differ in using g(n)']}
  },
  {id:'b2',qnum:2,label:'Q2',
   a:{q:'(a) Explain Minimax algorithm and Alpha-Beta pruning with examples.',opts:['Minimax: MAX maximizes, MIN minimizes. Alpha-Beta: prune when α≥β. Reduces effective depth from b^d to b^(d/2) with good ordering.','Alpha-Beta is less efficient than Minimax','Minimax only works for single-player games','Alpha-Beta changes the optimal decision'],ans:0,explain:'Minimax: recursively compute utility. MAX picks max child, MIN picks min child. Terminal states return utility. Time O(b^m). Alpha-Beta: maintain α (MAX lower bound) and β (MIN upper bound). Prune when α≥β—that subtree cannot affect result. Best case (perfect ordering): O(b^(m/2)) effective depth doubles!',wrongs:['Alpha-Beta is strictly faster—never changes result','Both work for 2-player adversarial games','Alpha-Beta gives IDENTICAL result, just faster']},
   b:{q:'(b) What are CSPs? Explain backtracking and constraint propagation.',opts:['CSP: variables+domains+constraints. Backtracking: DFS with early failure detection. AC-3: arc consistency, removes values with no support. MRV+LCV+forward checking improves efficiency.','CSPs cannot be solved systematically','Backtracking always visits all possible assignments','Constraint propagation increases search space'],ans:0,explain:'CSP: find assignment satisfying all constraints. Backtracking: assign variable, check constraints, backtrack if conflict. Improvements: MRV (fewest values first), Degree heuristic, LCV, Forward checking (propagate after each assign). AC-3: for each arc (Xi,Xj), remove values in Di with no consistent value in Dj. Runs O(cd³).',wrongs:['CSP has many efficient systematic algorithms','MRV+pruning makes backtracking much more efficient','Constraint propagation REDUCES the search space']}
  },
  {id:'b3',qnum:3,label:'Q3',
   a:{q:'(a) Explain FOL syntax, semantics, and inference rules (UI, EI, Unification).',opts:['FOL: constants, variables, predicates, functions, ∀, ∃. UI: ∀x P(x)→P(c). EI: ∃x P(x)→P(Skolem). Unification: find MGU making two expressions identical.','FOL is identical to propositional logic','UI can only be applied once','Unification always fails for complex expressions'],ans:0,explain:'FOL extends PL with: objects (constants a,b,c), variables (x,y,z), predicates P(x), functions f(x), quantifiers ∀ (forall), ∃ (exists). UI: ∀x P(x) → P(c) for any constant, multiple applications OK. EI: ∃x P(x) → P(Skolem_c), apply ONCE, new Skolem constant. Unification: UNIFY(P(x,y), P(John,z))→{x/John,y/z}=MGU.',wrongs:['FOL is much more expressive than PL','UI can be applied multiple times with different constants','Unification succeeds with MGU for many expressions']},
   b:{q:'(b) Explain Forward Chaining and Backward Chaining in FOL with examples.',opts:['FC: data-driven, start from facts, apply rules to derive new facts. BC: goal-driven, start from goal, find rules that prove it, prove premises recursively.','Both are identical in approach','FC starts from the goal','BC is less efficient than FC for all problems'],ans:0,explain:'Forward Chaining: start with KB facts. Find all rules whose body is satisfied. Add heads as new facts. Repeat until goal derived or no new facts. Example: Man(John) + ∀x Man(x)→Mortal(x) → derive Mortal(John). Backward Chaining: start with GOAL (Mortal(John)). Find rule: Man(x)→Mortal(x). Unify: x=John. Now prove Man(John) — found in facts. Proved!',wrongs:['They differ fundamentally in direction','FC starts from facts, not goal','BC is more efficient when goal focuses search']}
  },
  {id:'b4',qnum:4,label:'Q4',
   a:{q:'(a) Explain Classical Planning with PDDL — components, action schema, and an example.',opts:['Planning: initial state, actions (preconditions+effects), goal. PDDL action schema: name+params+precondition+effect. Example: robot navigation with Move action.','Planning does not use formal language','PDDL has no preconditions','Planning can only solve trivial problems'],ans:0,explain:'Classical planning: fully observable, deterministic, find action sequence from initial to goal. PDDL: Initial state = conjunction of ground atoms (closed world—unlisted=false). Action schema: Move(robot,from,to) — Precond: At(robot,from)∧Connected(from,to). Effect: ¬At(robot,from)∧At(robot,to). Goal = conjunction of literals to achieve. Plan = sequence satisfying goal.',wrongs:['PDDL/STRIPS is the formal language for planning','Preconditions are essential to PDDL','Planning handles complex real-world problems']},
   b:{q:'(b) Explain Planning Graphs, Mutex relations, and GRAPHPLAN.',opts:['Planning graph: alternating literal/action layers. Mutex: actions that can\'t coexist (inconsistent effects/interference). GRAPHPLAN searches planning graph, extracts plan at each level.','Planning graphs are only for simple problems','Mutex means actions must occur together','GRAPHPLAN cannot find solutions'],ans:0,explain:'Planning graph: S0→A0→S1→A1→... Layer S0=initial literals. A0=applicable actions. S1=S0∪effects. Mutex actions: (1) inconsistent effects, (2) interference (action deletes other\'s precond), (3) competing needs. Mutex literals: no supporting action pair is non-mutex. GRAPHPLAN: expand graph level by level, attempt to extract plan at each Sk. Level-off theorem: plan exists only after graph levels off.',wrongs:['Planning graphs work for any propositional planning','Mutex = mutually EXCLUSIVE (cannot coexist)','GRAPHPLAN is sound and complete for propositional planning']}
  },
  {id:'b5',qnum:5,label:'Q5',
   a:{q:'(a) Explain Bayesian Networks — structure, semantics, CPTs, and inference.',opts:['BN: DAG, nodes=variables, edges=dependencies, CPTs=P(Xi|Parents). Joint=Π P(Xi|Parents(Xi)). Exact inference: enumerate hidden vars. Approx: sampling methods.','BN requires full joint distribution stored','BN nodes must be binary','Inference in BN is always exact'],ans:0,explain:'BN structure: DAG. Each node Xi has CPT: P(Xi|Parents(Xi)). Root nodes: priors P(Xi). Joint: P(X1...Xn)=Π P(Xi|Pa(Xi)). Query: P(Q|e)=α Σ_h P(Q,e,h). Exact inference: variable elimination, sum over hidden. Approximate: Prior sampling (topological order), Rejection sampling (reject ≠ evidence), Likelihood weighting (weight by P(e|parents)), MCMC/Gibbs sampling.',wrongs:['BN is compact — O(n·2^k) params vs O(2^n) for full joint','Nodes can be multi-valued or continuous','Exact inference is NP-hard; approximate methods used in practice']},
   b:{q:'(b) Explain Acting under Uncertainty — Probability axioms, Bayes Rule, and Decision Theory.',opts:['Uncertainty→probability degrees of belief. Axioms: P∈[0,1], ΣP=1, P(A∨B)=P(A)+P(B)-P(A∧B). Bayes: P(H|E)=P(E|H)P(H)/P(E). MEU: choose action maximizing expected utility.','Logic handles uncertainty completely','Bayes rule only works for independent events','Rational agents should maximize minimum utility'],ans:0,explain:'Uncertainty: agents act on degrees of belief, not certainty. Probability axioms (Kolmogorov). Bayes rule: P(cause|effect)=P(effect|cause)×P(cause)/P(effect). Useful: estimate P(symptom|disease) from data, compute P(disease|symptom) for diagnosis. Decision theory=probability+utility. MEU principle: rational agent chooses action a* = argmax EU(a) = argmax Σ P(s\'|a)×U(s\'). Basis for rational action.',wrongs:['Logic fails with exceptions and partial info','Bayes works for any events with defined probabilities','MEU = maximize EXPECTED utility, not minimum']}
  },
];

// SEM part B pairs (c+d options for each question)
const SEM_PARTB_CD = [
  {id:'sb1c',qnum:1,
   c:{q:'(c) Explain Hill Climbing, Simulated Annealing, and when local search is preferred.',opts:['HC: move to best neighbor, gets stuck at local max. SA: allow bad moves with prob e^(ΔE/T), T decreases. Use local search when path doesn\'t matter, only the goal state does.','SA always finds global optimum instantly','Hill climbing is always better than SA','Local search is not useful for any real problem'],ans:0,explain:'Hill Climbing: greedy, always move uphill. Problems: local maxima, plateaux, ridges. Solutions: random restarts, sideways moves. SA: inspired by annealing. Accept worse move with prob e^(ΔE/T). High T: many bad moves. T→0: like HC. Convergence theorem: slow enough cooling → optimal. Use local search: state-space optimization (n-queens, TSP, protein folding) where solution IS the goal state.',wrongs:['SA can find global optimum given slow enough cooling','SA escapes local maxima where HC gets stuck','Local search is very useful for optimization problems']},
   d:{q:'(d) Compare Informed vs Uninformed search strategies.',opts:['Uninformed: BFS,DFS,UCS,IDDFS — no domain knowledge, use only problem definition. Informed: A*,Greedy — use heuristic h(n). A*: optimal+complete. Trade-off: heuristic quality vs computation.','Informed search is always faster','Uninformed search cannot solve any problem','A* and BFS always expand same nodes'],ans:0,explain:'Uninformed: blind, systematic, use only successor function and goal test. BFS (complete,optimal-equal), DFS (memory efficient), UCS (optimal any cost), IDDFS (best of BFS+DFS). Informed: use problem knowledge h(n). Greedy (fast but incomplete/non-optimal). A* (optimal if h admissible, complete). Key: better heuristic → fewer nodes expanded → faster. Manhattan > misplaced tiles for 8-puzzle.',wrongs:['Good heuristics help but aren\'t always available','Both can solve complete search problems','A* expands fewer nodes with a good heuristic']},
  },
  {id:'sb2c',qnum:2,
   c:{q:'(c) Explain Propositional Logic — connectives, inference rules, and Resolution.',opts:['PL: ¬,∧,∨,⇒,⟺. P⇒Q≡¬P∨Q. Inference: Modus Ponens, And-Elimination, Resolution. Resolution: (P∨Q)∧(¬Q∨R)→(P∨R). Proof by refutation.','Resolution can only handle 2 clauses','P⇒Q is false when P=false','Resolution always terminates for any query'],ans:0,explain:'PL connectives: ¬(NOT), ∧(AND), ∨(OR), ⇒(IMPLIES), ⟺(IFF). Truth table: P⇒Q false only when P=T,Q=F. Inference rules: Modus Ponens (P,P⇒Q→Q), And-Elim (P∧Q→P). Resolution: (A∨B)∧(¬B∨C)→(A∨C). Proof by refutation: add ¬goal to KB in CNF, resolve until empty clause. Sound and refutation-complete.',wrongs:['Resolution is a complete proof system for general clauses','P⇒Q is TRUE (vacuously) when P=false','Resolution may loop if KB is unsatisfiable']},
   d:{q:'(d) Explain Knowledge-Based Agents and the Wumpus World.',opts:['KB agent: Tell (add facts), Ask (query), Infer (derive). Wumpus: grid, Wumpus+pits+gold. Percepts: Stench,Breeze,Glitter. Agent reasons: Breeze(1,2)→pit adjacent.','KB agents need complete world knowledge','Wumpus world is fully observable','KB agents cannot learn anything new'],ans:0,explain:'KB agent = tells+asks knowledge base. KB = set of sentences in formal language. Inference: derive new sentences. Wumpus 4×4 grid: agent starts (1,1), find gold, avoid Wumpus and pits. Sensors: Stench (Wumpus 1 step), Breeze (pit 1 step), Glitter (gold here), Bump, Scream. Reasoning: if Breeze in (1,2) but not (1,1): pit is in (2,2) or (1,3). Logical deduction from partial obs.',wrongs:['KB agents reason despite incomplete knowledge','Wumpus is PARTIALLY observable — key challenge','KB agents update KB with new observations']}
  },
  {id:'sb3c',qnum:3,
   c:{q:'(c) Explain FOL representation with syntax, semantics, and examples.',opts:['FOL: constants (John), variables (x), predicates (Parent(x,y)), functions (father(x)), quantifiers (∀,∃). Semantics: interpretation maps to domain. Examples: ∀x Student(x)⇒Works(x).','FOL cannot represent relations between objects','Predicates and functions are identical in FOL','∀ and ∃ mean the same thing'],ans:0,explain:'FOL syntax: Terms = constants | variables | function(terms). Sentences = Predicate(terms) | ¬S | S∧S | S∨S | S⇒S | ∀x S | ∃x S. Semantics: model M = (domain D + interpretation I). I maps constants to domain objects, predicates to relations, functions to functions on D. Example: ∀x (King(x)∧Greedy(x))⇒Evil(x). Captures: all greedy kings are evil. Much more expressive than PL.',wrongs:['FOL is specifically designed for object-relation representation','Predicates are relations (true/false); functions map to objects','∀: all; ∃: at least one — very different']},
   d:{q:'(d) Explain Knowledge Engineering in First-Order Logic.',opts:['Knowledge engineering: identify domain, gather facts, encode in FOL, validate. Steps: task→domain→KB→query→evaluate. Ontology: define categories, objects, relations.','FOL KB is constructed automatically','Knowledge engineering needs no domain expertise','KB encoding has no standard methodology'],ans:0,explain:'Knowledge Engineering process: 1) Identify task (what questions to answer). 2) Gather domain knowledge (books, experts). 3) Decide on vocabulary (predicates, functions, constants). 4) Encode general knowledge as FOL sentences. 5) Encode specific problem instance. 6) Pose queries, evaluate answers. 7) Debug and refine KB. Key: choosing good ontology (vocabulary) determines KB quality.',wrongs:['KE requires substantial human expertise','Domain experts and engineers collaborate','Developing good ontologies is an art and science']}
  },
  {id:'sb4c',qnum:4,
   c:{q:'(c) Explain Ontological Engineering, Categories, Objects, and Events.',opts:['Ontology: framework of categories. Upper ontology: Objects, Events, Space, Time. Categories via SubsetOf, MemberOf. Events: fluents change over time. Frame problem: what persists after actions.','Ontologies are only needed for expert systems','Events and objects are identical in AI KRs','The frame problem is already fully solved'],ans:0,explain:'Ontological engineering: design reusable conceptual framework. Upper ontology (universal): Objects (Physical, Abstract), Events, Processes, Time, Space, Place. Categories: SubsetOf(Dog,Mammal), MemberOf(Fido,Dog). Inheritance: Fido inherits Mammal properties. Events: have time intervals. Fluents: properties that change (At(Robot,Room) at time t). Frame problem: after action, most things unchanged — how to represent efficiently?',wrongs:['Ontologies are useful for any large KB system','Events have temporal extent; objects persist','Frame problem: various solutions (situation calculus, etc.) but remains challenging']},
   d:{q:'(d) Explain Reasoning with Default Information and Non-Monotonic Reasoning.',opts:['Default reasoning: "birds fly" unless exception (penguins, dead birds). Non-monotonic: adding facts can retract conclusions. Approaches: CWA, Default Logic, Circumscription.','Classical logic handles defaults naturally','Adding new facts never changes conclusions in logic','Default reasoning is equivalent to probability'],ans:0,explain:'Non-monotonic reasoning: classical logic is monotonic — adding facts only adds conclusions. Real world needs defaults with exceptions. Default Logic (Reiter): default rule = "normally" statement. Closed-World Assumption: unstated facts are false. Circumscription: minimize exceptions. Example: Bird(Tweety)→Flies(Tweety) by default, but Penguin(Tweety)→¬Flies(Tweety) overrides. Adding Penguin fact retracts Flies.',wrongs:['Classical logic cannot handle exceptions','Non-monotonic: new facts CAN retract old conclusions','Default reasoning is qualitative; probability is quantitative']}
  },
  {id:'sb5c',qnum:5,
   c:{q:'(c) Explain Approximate Inference in Bayesian Networks — sampling methods.',opts:['Prior sampling: sample P(Xi|parents) topologically. Rejection: discard ≠ evidence. Likelihood weighting: fix evidence, weight by P(e|parents). Gibbs MCMC: sample Xi|Markov_blanket.','Exact inference always works for large BNs','Sampling methods give exact results','MCMC requires complete knowledge of joint distribution'],ans:0,explain:'Approximate inference needed when exact (NP-hard) is intractable. Prior sampling: topological order, sample from CPTs, estimate P(Q)≈count/N. Rejection sampling: same but reject samples ≠ evidence; inefficient for rare evidence. Likelihood weighting: fix E=e, sample non-evidence vars, weight=ΠP(ei|parents); more efficient. Gibbs (MCMC): fix evidence, repeatedly resample one non-evidence var from P(Xi|MB(Xi)).',wrongs:['Exact BN inference is NP-hard for general networks','Sampling gives APPROXIMATE (but consistent) estimates','Gibbs uses local Markov blanket, not full joint']},
   d:{q:'(d) Explain Independence, Conditional Independence, and Dempster-Shafer Theory.',opts:['P(A∧B)=P(A)P(B): independence. P(A|B,C)=P(A|C): conditional independence. D-S: belief mass on sets, handles ignorance differently from Bayes. Bel(A)+Bel(¬A) can be < 1.','Independence and conditional independence are identical','D-S theory requires the same assumptions as Bayes','Conditional independence never holds in practice'],ans:0,explain:'Independence: P(A|B)=P(A). Weather⊥Toothache. Conditional independence: P(A|B,C)=P(A|C) — B adds nothing given C. P(Weather|Cavity,Toothache)=P(Weather). Enables Naive Bayes. D-S theory: mass function m(A) for sets A. Belief Bel(A)=ΣB⊆A m(B). Plausibility Pl(A)=1-Bel(¬A). Unlike Bayes: Bel(A)+Bel(¬A)≤1 — gap = ignorance. Dempster\'s rule combines two mass functions.',wrongs:['Conditional independence is given Z; plain independence is unconditional','D-S handles ignorance; Bayes must assign probabilities to everything','Conditional independence is foundational to BN efficiency']}
  },
];

// ================================================================
// STATE
// ================================================================
let state={
  section:'mid',
  mid:{mode:'flash',unit:'all'},
  sem:{mode:'flash',unit:'all'},
  midExam:{partA:{},partB:{},partBAttempts:new Set(),submitted:false,mistakes:[]},
  semExam:{partA:{},partB:{},pairSelections:{},submitted:false,mistakes:[]}
};

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function showSection(s){
  state.section=s;
  ['mid','sem'].forEach(x=>{
    document.getElementById('panel-'+x).classList.toggle('active',x===s);
    document.getElementById('stab-'+x).classList.toggle('active',x===s);
    document.getElementById('nav-'+x).classList.toggle('active',x===s);
  });
  renderAll(s);
}

function setMode(sec,mode){
  state[sec].mode=mode;
  ['flash','exam'].forEach(m=>{
    document.getElementById(sec+'-'+m).classList.toggle('active',m===mode);
  });
  document.querySelectorAll('#panel-'+sec+' .mtab').forEach((b,i)=>{
    b.classList.toggle('active',(i===0&&mode==='flash')||(i===1&&mode==='exam'));
  });
  if(mode==='exam')buildExam(sec);
  else renderAll(sec);
}

function filterUnit(sec,unit){
  state[sec].unit=unit;
  document.querySelectorAll('#uf-'+sec+' .ufbtn').forEach(b=>{
    const m=b.getAttribute('onclick').match(/'([^']+)'\)$/);
    if(m)b.classList.toggle('active',m[1]===unit);
  });
  renderFlashcards(sec);
}

function getFlashData(sec){
  let data=[...FLASHCARDS];
  if(state[sec].unit!=='all')data=data.filter(d=>d.u===state[sec].unit);
  return data;
}

function renderFlashcards(sec){
  const data=shuffle(getFlashData(sec));
  const grid=document.getElementById('fc-'+sec);
  const cnt=document.getElementById('fc-count-'+sec);
  updateStats(sec,data);
  if(!data.length){grid.innerHTML='<div class="empty">No flashcards match filter.</div>';cnt.textContent='';return;}
  grid.innerHTML=data.map(d=>`<div class="fc" onclick="this.classList.toggle('flipped')"><div class="fc-inner"><div class="fc-front"><div><div class="fc-tag">${d.tag} · Unit ${d.u}</div><div class="fc-q">${d.q}</div></div><div class="fc-hint">tap to flip ↓</div></div><div class="fc-back"><div class="fc-tag">Answer</div><div class="fc-ans">${d.a.replace(/\n/g,'<br>')}${d.f?'<span class="formula">'+d.f+'</span>':''}</div><div class="fc-unit">Unit ${d.u}</div></div></div></div>`).join('');
  cnt.textContent=data.length+' flashcards · click to flip · shuffled each time';
}

function updateStats(sec,data){
  const bar=document.getElementById('stats-'+sec);
  const units=[...new Set(data.map(d=>d.u))].sort();
  let html=`<div class="stat"><div class="stat-n">${data.length}</div><div class="stat-l">Total</div></div>`;
  units.forEach(u=>{const c=data.filter(d=>d.u===u).length;html+=`<div class="stat"><div class="stat-n">${c}</div><div class="stat-l">Unit ${u}</div></div>`;});
  bar.innerHTML=html;
}

function buildExam(sec){if(sec==='mid')buildMidExam();else buildSemExam();}

// -------- MID EXAM --------
function buildMidExam(){
  const st=state.midExam;st.partA={};st.partB={};st.partBAttempts=new Set();st.submitted=false;st.mistakes=[];
  const pAQs=shuffle(PARTA_BANK).slice(0,5);
  const pBQs=shuffle(PARTB_BANK);
  let html=`<div class="exam-header"><h2>Mid Examination — 30 Marks</h2><p>Part A: All 5 MCQs (2M each = 10M) · Part B: 6 questions, attempt any 4 (each 5M+5M = 10M each = 20M)</p><div class="exam-score-bar"><div class="escore"><div class="escore-n" id="mid-score-a">—</div><div class="escore-l">Part A /10</div></div><div class="escore"><div class="escore-n" id="mid-score-b">—</div><div class="escore-l">Part B /20</div></div><div class="escore"><div class="escore-n" id="mid-score-total">—</div><div class="escore-l">Total /30</div></div></div></div>`;
  html+=`<div class="part-header">PART A — 5 Questions × 2 Marks = 10 Marks (Attempt All)</div>`;
  pAQs.forEach((q,i)=>{
    st.partA[q.id]=null;
    html+=`<div class="parta-q"><div class="parta-meta"><div class="parta-num">Q${i+1}</div><div class="parta-marks">2 Marks · Unit ${q.u}</div></div><div class="parta-text">${q.q}</div><div class="parta-opts">${q.opts.map((o,j)=>`<button class="parta-opt" id="mid-pa-${q.id}-${j}" onclick="selectPA('mid','${q.id}',${j})">${o}</button>`).join('')}</div><div class="parta-explain" id="mid-exp-${q.id}"></div></div>`;
  });
  html+=`<div class="part-header">PART B — 6 Questions, Attempt ANY 4 × 10 Marks = 20 Marks</div><div class="mid-info" id="mid-att-info">✦ Attempted: 0/4 — Select any 4 questions</div>`;
  pBQs.forEach(q=>{
    st.partB[q.id]={a:null,b:null,selected:false};
    html+=`<div class="partb-q" id="mid-pbq-${q.id}"><div class="partb-meta"><div class="partb-num">${q.label}</div><div class="partb-marks">10M (5+5)</div></div><div style="margin-bottom:10px"><button class="pair-btn" id="mid-sel-${q.id}" onclick="toggleMidPB('${q.id}')">+ Select this question</button></div><div id="mid-pbc-${q.id}" style="display:none">`;
    html+=`<div class="sub-q"><div class="sub-q-label">Part (a)</div><div class="sub-q-text">${q.a.q}</div><div class="sub-opts">${q.a.opts.map((o,j)=>`<button class="sub-opt" id="mid-sa-${q.id}-${j}" onclick="selectMidSub('${q.id}','a',${j})">${o}</button>`).join('')}</div><div class="sub-explain" id="mid-sea-${q.id}"></div></div>`;
    html+=`<div class="sub-q"><div class="sub-q-label">Part (b)</div><div class="sub-q-text">${q.b.q}</div><div class="sub-opts">${q.b.opts.map((o,j)=>`<button class="sub-opt" id="mid-sb-${q.id}-${j}" onclick="selectMidSub('${q.id}','b',${j})">${o}</button>`).join('')}</div><div class="sub-explain" id="mid-seb-${q.id}"></div></div>`;
    html+=`</div></div>`;
  });
  html+=`<div class="exam-actions"><button class="btn btn-red" onclick="submitMidExam()">Submit & Score</button><button class="btn btn-outline" onclick="buildMidExam()">New Exam</button></div><div id="mid-result"></div>`;
  document.getElementById('mid-exam-body').innerHTML=html;
  document.getElementById('mid-exam-body')._pAQs=pAQs;
  document.getElementById('mid-exam-body')._pBQs=pBQs;
}

function toggleMidPB(qid){
  const st=state.midExam;const att=st.partBAttempts;
  if(att.has(qid)){att.delete(qid);st.partB[qid].selected=false;document.getElementById('mid-pbc-'+qid).style.display='none';document.getElementById('mid-sel-'+qid).textContent='+ Select this question';document.getElementById('mid-sel-'+qid).classList.remove('active');}
  else{if(att.size>=4){alert('Max 4 questions. Deselect one first.');return;}att.add(qid);st.partB[qid].selected=true;document.getElementById('mid-pbc-'+qid).style.display='block';document.getElementById('mid-sel-'+qid).textContent='✓ Selected — click to deselect';document.getElementById('mid-sel-'+qid).classList.add('active');}
  document.getElementById('mid-att-info').textContent=`✦ Attempted: ${att.size}/4 — ${att.size<4?'Select '+(4-att.size)+' more':'All 4 selected!'}`;
}

function selectPA(sec,qid,chosen){
  const st=state[sec+'Exam'];if(st.submitted)return;
  st.partA[qid]=chosen;
  const bank=PARTA_BANK;const q=bank.find(x=>x.id===qid);
  q.opts.forEach((_,j)=>{const el=document.getElementById(sec+'-pa-'+qid+'-'+j);if(el)el.classList.toggle('selected',j===chosen);});
}

function selectMidSub(qid,part,chosen){
  if(state.midExam.submitted)return;
  state.midExam.partB[qid][part]=chosen;
  const q=PARTB_BANK.find(x=>x.id===qid);
  q[part].opts.forEach((_,j)=>{const el=document.getElementById('mid-s'+part+'-'+qid+'-'+j);if(el)el.classList.toggle('selected',j===chosen);});
}

function submitMidExam(){
  const st=state.midExam;if(st.submitted)return;
  const body=document.getElementById('mid-exam-body');
  const pAQs=body._pAQs,pBQs=body._pBQs;
  if(st.partBAttempts.size<4&&!confirm(`Only ${st.partBAttempts.size}/4 Part B attempted. Submit anyway?`))return;
  st.submitted=true;st.mistakes=[];let sA=0,sB=0;
  pAQs.forEach(q=>{
    const c=st.partA[q.id];const ok=c===q.ans;if(ok)sA+=2;
    q.opts.forEach((_,j)=>{const el=document.getElementById('mid-pa-'+q.id+'-'+j);if(el){el.classList.add('locked');el.classList.remove('selected');if(j===q.ans)el.classList.add('correct');else if(j===c)el.classList.add('wrong');}});
    const ex=document.getElementById('mid-exp-'+q.id);
    if(ex){const wm=c!==null&&c!==q.ans?`<div class="why-wrong">✗ You chose: "${q.opts[c]}" — ${q.wrongs&&q.wrongs[c]?q.wrongs[c]:''}</div>`:'';ex.innerHTML=`<strong>${ok?'✓ Correct!':c===null?'⚠ Not answered':'✗ Incorrect.'}</strong> ${q.explain}${wm}`;ex.classList.add('show');}
    if(!ok)st.mistakes.push({q:q.q,yours:c!==null?q.opts[c]:'Not answered',correct:q.opts[q.ans],explain:q.explain});
  });
  pBQs.forEach(q=>{
    if(!st.partBAttempts.has(q.id))return;
    ['a','b'].forEach(pt=>{
      const c=st.partB[q.id][pt];const sq=q[pt];const ok=c===sq.ans;if(ok)sB+=5;
      sq.opts.forEach((_,j)=>{const el=document.getElementById('mid-s'+pt+'-'+q.id+'-'+j);if(el){el.classList.add('locked');el.classList.remove('selected');if(j===sq.ans)el.classList.add('correct');else if(j===c)el.classList.add('wrong');}});
      const ex=document.getElementById('mid-se'+pt+'-'+q.id);
      if(ex){const wm=c!==null&&c!==sq.ans?`<div class="why-wrong">✗ You chose: "${sq.opts[c]}" — ${sq.wrongs&&sq.wrongs[c]?sq.wrongs[c]:''}</div>`:'';ex.innerHTML=`<strong>${ok?'✓ Correct!':c===null?'⚠ Not answered':'✗ Incorrect.'}</strong> ${sq.explain}${wm}`;ex.classList.add('show');}
      if(!ok)st.mistakes.push({q:sq.q,yours:c!==null?sq.opts[c]:'Not answered',correct:sq.opts[sq.ans],explain:sq.explain});
    });
  });
  const tot=sA+sB;
  document.getElementById('mid-score-a').textContent=sA+'/10';
  document.getElementById('mid-score-b').textContent=sB+'/'+(st.partBAttempts.size*10);
  document.getElementById('mid-score-total').textContent=tot+'/30';
  renderResult('mid-result',tot,30,st.mistakes,'mid');
}

// -------- SEM EXAM --------
function buildSemExam(){
  const st=state.semExam;st.partA={};st.partB={};st.pairSelections={};st.submitted=false;st.mistakes=[];
  const pAQs=shuffle(PARTA_BANK).slice(0,10);
  const pBQs=shuffle(PARTB_BANK);
  let html=`<div class="exam-header"><h2>Semester Examination — 60 Marks</h2><p>Part A: All 10 MCQs (1M each = 10M) · Part B: All 5 Qs, choose (a)+(b) OR (c)+(d) per question (5+5=10M each × 5 = 50M)</p><div class="exam-score-bar"><div class="escore"><div class="escore-n" id="sem-score-a">—</div><div class="escore-l">Part A /10</div></div><div class="escore"><div class="escore-n" id="sem-score-b">—</div><div class="escore-l">Part B /50</div></div><div class="escore"><div class="escore-n" id="sem-score-total">—</div><div class="escore-l">Total /60</div></div></div></div>`;
  html+=`<div class="part-header">PART A — 10 Questions × 1 Mark = 10 Marks</div>`;
  pAQs.forEach((q,i)=>{
    st.partA[q.id]=null;
    html+=`<div class="parta-q"><div class="parta-meta"><div class="parta-num">Q${i+1}</div><div class="parta-marks">1 Mark · Unit ${q.u}</div></div><div class="parta-text">${q.q}</div><div class="parta-opts">${q.opts.map((o,j)=>`<button class="parta-opt" id="sem-pa-${q.id}-${j}" onclick="selectPA('sem','${q.id}',${j})">${o}</button>`).join('')}</div><div class="parta-explain" id="sem-exp-${q.id}"></div></div>`;
  });
  html+=`<div class="part-header">PART B — 5 Questions × 10 Marks = 50 Marks (Choose one pair per question)</div>`;
  pBQs.forEach((q,qi)=>{
    const cd=SEM_PARTB_CD[qi]||SEM_PARTB_CD[0];
    st.partB[q.id]={pairAB:{a:null,b:null},pairCD:{c:null,d:null}};st.pairSelections[q.id]=null;
    html+=`<div class="partb-q"><div class="partb-meta"><div class="partb-num">${q.label} — Choose: (a)+(b) OR (c)+(d)</div><div class="partb-marks">10M</div></div>`;
    html+=`<div class="pair-selector"><button class="pair-btn" id="sem-pair-${q.id}-AB" onclick="selectSemPair('${q.id}','AB')">Answer (a)+(b)</button><button class="pair-btn" id="sem-pair-${q.id}-CD" onclick="selectSemPair('${q.id}','CD')">Answer (c)+(d)</button></div>`;
    html+=`<div class="pair-questions" id="sem-pq-${q.id}-AB">`;
    html+=`<div class="sub-q"><div class="sub-q-label">Part (a)</div><div class="sub-q-text">${q.a.q}</div><div class="sub-opts">${q.a.opts.map((o,j)=>`<button class="sub-opt" id="sem-sa-${q.id}-${j}" onclick="selectSemSub('${q.id}','a',${j},'AB')">${o}</button>`).join('')}</div><div class="sub-explain" id="sem-sea-${q.id}"></div></div>`;
    html+=`<div class="sub-q"><div class="sub-q-label">Part (b)</div><div class="sub-q-text">${q.b.q}</div><div class="sub-opts">${q.b.opts.map((o,j)=>`<button class="sub-opt" id="sem-sb-${q.id}-${j}" onclick="selectSemSub('${q.id}','b',${j},'AB')">${o}</button>`).join('')}</div><div class="sub-explain" id="sem-seb-${q.id}"></div></div></div>`;
    html+=`<div class="pair-questions" id="sem-pq-${q.id}-CD">`;
    html+=`<div class="sub-q"><div class="sub-q-label">Part (c)</div><div class="sub-q-text">${cd.c.q}</div><div class="sub-opts">${cd.c.opts.map((o,j)=>`<button class="sub-opt" id="sem-sc-${q.id}-${j}" onclick="selectSemSub('${q.id}','c',${j},'CD')">${o}</button>`).join('')}</div><div class="sub-explain" id="sem-sec-${q.id}"></div></div>`;
    html+=`<div class="sub-q"><div class="sub-q-label">Part (d)</div><div class="sub-q-text">${cd.d.q}</div><div class="sub-opts">${cd.d.opts.map((o,j)=>`<button class="sub-opt" id="sem-sd-${q.id}-${j}" onclick="selectSemSub('${q.id}','d',${j},'CD')">${o}</button>`).join('')}</div><div class="sub-explain" id="sem-sed-${q.id}"></div></div></div>`;
    html+=`</div>`;
  });
  html+=`<div class="exam-actions"><button class="btn btn-red" onclick="submitSemExam()">Submit & Score</button><button class="btn btn-outline" onclick="buildSemExam()">New Exam</button></div><div id="sem-result"></div>`;
  document.getElementById('sem-exam-body').innerHTML=html;
  document.getElementById('sem-exam-body')._pAQs=pAQs;
  document.getElementById('sem-exam-body')._pBQs=pBQs;
}

function selectSemPair(qid,pair){
  if(state.semExam.submitted)return;
  state.semExam.pairSelections[qid]=pair;
  ['AB','CD'].forEach(p=>{
    const el=document.getElementById('sem-pq-'+qid+'-'+p);
    const btn=document.getElementById('sem-pair-'+qid+'-'+p);
    if(el)el.classList.toggle('active',p===pair);
    if(btn)btn.classList.toggle('active',p===pair);
  });
}

function selectSemSub(qid,part,chosen,pair){
  if(state.semExam.submitted)return;
  const pKey='pair'+pair;
  state.semExam.partB[qid][pKey][part]=chosen;
  const qi=PARTB_BANK.findIndex(x=>x.id===qid);
  const cd=SEM_PARTB_CD[qi]||SEM_PARTB_CD[0];
  const qObj=pair==='AB'?PARTB_BANK[qi]:cd;
  qObj[part].opts.forEach((_,j)=>{const el=document.getElementById('sem-s'+part+'-'+qid+'-'+j);if(el)el.classList.toggle('selected',j===chosen);});
}

function submitSemExam(){
  const st=state.semExam;if(st.submitted)return;
  const body=document.getElementById('sem-exam-body');const pAQs=body._pAQs,pBQs=body._pBQs;
  st.submitted=true;st.mistakes=[];let sA=0,sB=0;
  pAQs.forEach(q=>{
    const c=st.partA[q.id];const ok=c===q.ans;if(ok)sA+=1;
    q.opts.forEach((_,j)=>{const el=document.getElementById('sem-pa-'+q.id+'-'+j);if(el){el.classList.add('locked');el.classList.remove('selected');if(j===q.ans)el.classList.add('correct');else if(j===c)el.classList.add('wrong');}});
    const ex=document.getElementById('sem-exp-'+q.id);
    if(ex){const wm=c!==null&&c!==q.ans?`<div class="why-wrong">✗ You chose: "${q.opts[c]}" — ${q.wrongs&&q.wrongs[c]?q.wrongs[c]:''}</div>`:'';ex.innerHTML=`<strong>${ok?'✓ Correct!':c===null?'⚠ Not answered':'✗ Incorrect.'}</strong> ${q.explain}${wm}`;ex.classList.add('show');}
    if(!ok)st.mistakes.push({q:q.q,yours:c!==null?q.opts[c]:'Not answered',correct:q.opts[q.ans],explain:q.explain});
  });
  pBQs.forEach((q,qi)=>{
    const pair=st.pairSelections[q.id];if(!pair)return;
    const cd=SEM_PARTB_CD[qi]||SEM_PARTB_CD[0];
    const parts=pair==='AB'?['a','b']:['c','d'];
    const pKey='pair'+pair;
    parts.forEach(pt=>{
      const c=st.partB[q.id][pKey][pt];
      const sq=pair==='AB'?q[pt]:cd[pt];
      const ok=c===sq.ans;if(ok)sB+=5;
      sq.opts.forEach((_,j)=>{const el=document.getElementById('sem-s'+pt+'-'+q.id+'-'+j);if(el){el.classList.add('locked');el.classList.remove('selected');if(j===sq.ans)el.classList.add('correct');else if(j===c)el.classList.add('wrong');}});
      const ex=document.getElementById('sem-se'+pt+'-'+q.id);
      if(ex){const wm=c!==null&&c!==sq.ans?`<div class="why-wrong">✗ You chose: "${sq.opts[c]}" — ${sq.wrongs&&sq.wrongs[c]?sq.wrongs[c]:''}</div>`:'';ex.innerHTML=`<strong>${ok?'✓ Correct!':c===null?'⚠ Not answered':'✗ Incorrect.'}</strong> ${sq.explain}${wm}`;ex.classList.add('show');}
      if(!ok)st.mistakes.push({q:sq.q,yours:c!==null?sq.opts[c]:'Not answered',correct:sq.opts[sq.ans],explain:sq.explain});
    });
  });
  const tot=sA+sB;
  document.getElementById('sem-score-a').textContent=sA+'/10';
  document.getElementById('sem-score-b').textContent=sB+'/50';
  document.getElementById('sem-score-total').textContent=tot+'/60';
  renderResult('sem-result',tot,60,st.mistakes,'sem');
}

function renderResult(elId,score,max,mistakes,sec){
  const pct=Math.round((score/max)*100);
  const msgs=['Keep going — flashcard review first, then retake.','Needs work. Go over each wrong answer carefully.','Good effort! A few more reviews and you\'re ready.','Excellent — you\'re well-prepared for the exam!'];
  const msg=msgs[pct>=80?3:pct>=60?2:pct>=40?1:0];
  let mHTML='';
  if(mistakes.length>0){
    mHTML=`<div class="mistake-list"><div class="part-header">Mistakes to Review (${mistakes.length})</div>`;
    mistakes.forEach(m=>{mHTML+=`<div class="mistake-item"><div class="mistake-q">${m.q}</div><div class="m-you">✗ You: ${m.yours}</div><div class="m-correct">✓ Correct: ${m.correct}</div><div class="m-explain">${m.explain}</div></div>`;});
    mHTML+='</div>';
  }else mHTML='<div style="text-align:center;padding:1rem;color:var(--green)">🎉 Perfect! No mistakes!</div>';
  document.getElementById(elId).innerHTML=`<div class="result-panel"><div class="result-big">${pct}%</div><div class="result-sub">${sec==='mid'?'Mid':'Semester'} Exam — ${score}/${max}</div><div class="result-breakdown"><div class="rb"><div class="rb-n" style="color:var(--green)">${score}</div><div class="rb-l">Score</div></div><div class="rb"><div class="rb-n" style="color:var(--red2)">${max-score}</div><div class="rb-l">Lost</div></div><div class="rb"><div class="rb-n">${max}</div><div class="rb-l">Total</div></div></div><div class="result-msg">${msg}</div>${mHTML}<div class="exam-actions" style="justify-content:center"><button class="btn btn-red" onclick="buildExam('${sec}')">New Exam</button><button class="btn btn-outline" onclick="setMode('${sec}','flash')">Review Flashcards</button></div></div>`;
  document.getElementById(elId).scrollIntoView({behavior:'smooth',block:'start'});
}

function renderAll(sec){renderFlashcards(sec);}
renderFlashcards('mid');
renderFlashcards('sem');
</script>
</body>
</html>
