<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Exam Prep — JNTUH</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Roboto+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--bg2:#111111;--bg3:#1a1a1a;--bg4:#222222;--red:#e02020;--red2:#ff3333;--red3:#c01010;--red-dim:rgba(224,32,32,0.12);--red-glow:rgba(224,32,32,0.25);--green:#22c55e;--green-dim:rgba(34,197,94,0.1);--white:#f5f5f5;--white2:#cccccc;--white3:#888888;--border:rgba(255,255,255,0.08);--border-red:rgba(224,32,32,0.4)}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--white);font-family:'Roboto Mono',monospace;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:0.5}
.header{position:sticky;top:0;z-index:100;background:rgba(10,10,10,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 2rem}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--white);letter-spacing:.02em}
.logo span{color:var(--red)}.logo a{color:var(--white3);text-decoration:none;font-size:11px;font-family:'Roboto Mono',monospace;letter-spacing:.06em}.logo a:hover{color:var(--red2)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav-btn{background:none;border:none;color:var(--white3);font-family:'Roboto Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;cursor:pointer;border-radius:4px;transition:all .2s}
.nav-btn:hover,.nav-btn.active{background:var(--red-dim);color:var(--red2)}
.main{max-width:1200px;margin:0 auto;padding:2rem;position:relative;z-index:1}
.page-title{margin-bottom:2rem}.page-title h1{font-family:'Playfair Display',serif;font-size:2.2rem;font-weight:700;line-height:1.2;margin-bottom:6px}
.page-title h1 em{font-style:italic;color:var(--red)}.page-title p{font-size:11px;color:var(--white3);letter-spacing:.08em;text-transform:uppercase}
.div-line{height:1px;background:linear-gradient(90deg,var(--red),transparent);margin-bottom:2rem;opacity:.4}
.section-tabs{display:flex;gap:10px;margin-bottom:2rem;flex-wrap:wrap}
.stab{flex:1;min-width:160px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:1rem 1.2rem;cursor:pointer;transition:all .25s;text-align:left}
.stab:hover{border-color:var(--border-red);background:var(--bg3)}
.stab.active{border-color:var(--red);background:var(--red-dim);box-shadow:0 0 24px var(--red-glow)}
.stab-label{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--white3);margin-bottom:3px}
.stab-title{font-family:'Playfair Display',serif;font-size:1rem;color:var(--white)}.stab.active .stab-title{color:var(--red2)}.stab-marks{font-size:10px;color:var(--white3);margin-top:3px}
.mode-tabs{display:flex;gap:8px;margin-bottom:1.5rem}
.mtab{background:var(--bg2);border:1px solid var(--border);color:var(--white3);font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:8px 20px;cursor:pointer;border-radius:4px;transition:all .2s}
.mtab:hover{color:var(--white);border-color:rgba(255,255,255,.2)}.mtab.active{background:var(--red);border-color:var(--red);color:#fff}
.unit-filter{display:flex;gap:6px;margin-bottom:1.5rem;flex-wrap:wrap}
.ufbtn{background:var(--bg3);border:1px solid var(--border);color:var(--white3);font-family:'Roboto Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:5px 12px;cursor:pointer;border-radius:3px;transition:all .15s}
.ufbtn:hover{border-color:var(--border-red);color:var(--white)}.ufbtn.active{background:var(--red-dim);border-color:var(--red);color:var(--red2)}
.cpanel{display:none}.cpanel.active{display:block}
.stats-bar{display:flex;gap:12px;margin-bottom:1.5rem;flex-wrap:wrap}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:8px 14px;display:flex;flex-direction:column;gap:2px}
.stat-n{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--red2)}.stat-l{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--white3)}
.fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.fc{perspective:1000px;height:240px;cursor:pointer}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;border-radius:8px;padding:1.4rem;display:flex;flex-direction:column;justify-content:space-between}
.fc-front{background:var(--bg2);border:1px solid var(--border)}.fc-front:hover{border-color:var(--border-red)}
.fc-back{background:var(--bg3);border:1px solid var(--red);transform:rotateY(180deg)}
.fc-tag{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:6px}
.fc-q{font-family:'Playfair Display',serif;font-size:.9rem;color:var(--white);line-height:1.5;flex:1;display:flex;align-items:center}
.fc-hint{font-size:10px;color:var(--white3);letter-spacing:.06em}
.fc-ans{font-size:11px;color:var(--white2);line-height:1.6;overflow-y:auto;flex:1}
.fc-ans .formula{color:var(--red2);display:block;margin:4px 0;font-size:10px;font-style:italic}
.fc-unit{font-size:9px;color:var(--white3);letter-spacing:.1em;text-transform:uppercase}
.fc-count{font-size:10px;color:var(--white3);text-align:center;margin-top:1rem}
/* EXAM */
.exam-wrap{max-width:820px;margin:0 auto}
.exam-header{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:1.5rem;margin-bottom:1.5rem}
.exam-header h2{font-family:'Playfair Display',serif;font-size:1.3rem;margin-bottom:.4rem}.exam-header p{font-size:11px;color:var(--white3);line-height:1.7}
.exam-score-bar{display:flex;gap:20px;margin-top:1rem;flex-wrap:wrap}
.escore{text-align:center}.escore-n{font-family:'Playfair Display',serif;font-size:1.8rem;color:var(--red2)}.escore-l{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--white3)}
.part-header{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--red);margin:2rem 0 1rem;padding-bottom:.5rem;border-bottom:1px solid var(--border-red)}
.parta-q{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:1.2rem 1.5rem;margin-bottom:12px;transition:all .2s}
.parta-q:hover{border-color:var(--border-red)}
.parta-meta{display:flex;justify-content:space-between;margin-bottom:.5rem}
.parta-num{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}.parta-marks{font-size:10px;color:var(--white3)}
.parta-text{font-family:'Playfair Display',serif;font-size:.95rem;color:var(--white);line-height:1.5;margin-bottom:.8rem}
.parta-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.parta-opt{background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:9px 12px;cursor:pointer;font-size:11px;color:var(--white2);transition:all .2s;text-align:left;line-height:1.4}
.parta-opt:hover:not(.locked){border-color:rgba(255,255,255,.2);color:var(--white)}
.parta-opt.selected{border-color:var(--red2);background:var(--red-dim);color:var(--white)}
.parta-opt.correct{border-color:var(--green)!important;background:var(--green-dim)!important;color:#86efac!important}
.parta-opt.wrong{border-color:var(--red)!important;background:var(--red-dim)!important;color:#fca5a5!important}
.parta-opt.locked{cursor:default}
.parta-explain{background:var(--bg3);border-left:3px solid var(--border-red);padding:10px 14px;margin-top:.5rem;font-size:11px;color:var(--white2);line-height:1.6;border-radius:0 4px 4px 0;display:none}
.parta-explain.show{display:block}.parta-explain .why-wrong{color:#fca5a5;font-size:10px;margin-top:.4rem}
.partb-q{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:1.5rem;margin-bottom:16px}
.partb-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.partb-num{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);font-weight:500}.partb-marks{font-size:10px;color:var(--white3)}
.sub-q{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:1.1rem;margin-bottom:10px}
.sub-q-label{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin-bottom:6px}
.sub-q-text{font-family:'Playfair Display',serif;font-size:.9rem;color:var(--white);line-height:1.5;margin-bottom:.6rem}
.sub-opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.sub-opt{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:8px 10px;cursor:pointer;font-size:11px;color:var(--white2);transition:all .2s;text-align:left;line-height:1.4}
.sub-opt:hover:not(.locked){border-color:rgba(255,255,255,.2);color:var(--white)}
.sub-opt.selected{border-color:var(--red2);background:var(--red-dim)}
.sub-opt.correct{border-color:var(--green)!important;background:var(--green-dim)!important;color:#86efac!important}
.sub-opt.wrong{border-color:var(--red)!important;background:var(--red-dim)!important;color:#fca5a5!important}
.sub-opt.locked{cursor:default}
.sub-explain{background:rgba(0,0,0,.3);border-left:3px solid var(--border-red);padding:8px 12px;margin-top:6px;font-size:11px;color:var(--white2);line-height:1.6;border-radius:0 4px 4px 0;display:none}
.sub-explain.show{display:block}.sub-explain .why-wrong{color:#fca5a5;font-size:10px;margin-top:.3rem}
.pair-selector{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
.pair-btn{background:var(--bg3);border:1px solid var(--border);color:var(--white3);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;cursor:pointer;border-radius:4px;transition:all .2s}
.pair-btn:hover{border-color:var(--border-red);color:var(--white)}.pair-btn.active{background:var(--red-dim);border-color:var(--red);color:var(--red2)}
.pair-questions{display:none}.pair-questions.active{display:block}
.mid-info{background:var(--red-dim);border:1px solid var(--border-red);border-radius:6px;padding:10px 16px;margin-bottom:1rem;font-size:11px;color:var(--red2)}
.btn{font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:4px;cursor:pointer;transition:all .2s;border:none}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:var(--red2)}
.btn-outline{background:none;border:1px solid var(--border);color:var(--white3)}.btn-outline:hover{border-color:var(--border-red);color:var(--white)}
.exam-actions{display:flex;gap:10px;margin-top:2rem;flex-wrap:wrap}
.result-panel{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:2rem;margin-top:2rem;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.result-big{font-family:'Playfair Display',serif;font-size:4rem;color:var(--red);line-height:1;text-align:center}
.result-sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--white3);text-align:center;margin:.5rem 0 1.5rem}
.result-breakdown{display:flex;gap:2rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.5rem}
.rb{text-align:center}.rb-n{font-family:'Playfair Display',serif;font-size:2rem}.rb-l{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--white3)}
.result-msg{text-align:center;font-size:13px;color:var(--white2);max-width:450px;margin:0 auto 1.5rem;line-height:1.7}
.mistake-list{margin-top:1.5rem}
.mistake-item{background:var(--bg3);border:1px solid rgba(224,32,32,.25);border-radius:8px;padding:1rem 1.2rem;margin-bottom:10px}
.mistake-q{font-family:'Playfair Display',serif;font-size:.9rem;color:var(--white);margin-bottom:.5rem}
.m-you{color:#fca5a5;font-size:11px}.m-correct{color:#86efac;font-size:11px}.m-explain{color:var(--white3);line-height:1.5;font-size:11px;margin-top:.4rem}
.empty{text-align:center;padding:3rem;color:var(--white3);font-size:13px}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--red3);border-radius:2px}
@media(max-width:600px){.parta-opts,.sub-opts{grid-template-columns:1fr}.section-tabs{flex-direction:column}.fc-grid{grid-template-columns:1fr}.nav{gap:2px}}
</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <div class="logo">Engg<span>.</span>Prep <span style="font-size:.75rem;color:var(--white3);font-family:'Roboto Mono',monospace;font-weight:300">— AI</span></div>
    <nav class="nav">
      <button class="nav-btn active" id="nav-mid" onclick="showSection('mid')">Mid · 30M</button>
      <button class="nav-btn" id="nav-sem" onclick="showSection('sem')">Sem · 60M</button>
    </nav>
  </div>
</div>

<div class="main">
  <div class="page-title">
    <h1>Artificial<br><em>Intelligence</em></h1>
    <p>JNTUH · All 5 Units · Search, Logic, Planning, Probability, Bayesian Networks</p>
  </div>
  <div class="div-line"></div>

  <div class="section-tabs">
    <div class="stab active" id="stab-mid" onclick="showSection('mid')">
      <div class="stab-label">Section 1</div>
      <div class="stab-title">Mid Examination</div>
      <div class="stab-marks">30M · Part A: 5×2M · Part B: 4×5M</div>
    </div>
    <div class="stab" id="stab-sem" onclick="showSection('sem')">
      <div class="stab-label">Section 2</div>
      <div class="stab-title">Semester Examination</div>
      <div class="stab-marks">60M · Part A: 10×1M · Part B: 5Q choose pairs</div>
    </div>
  </div>

  <!-- MID PANEL -->
  <div class="cpanel active" id="panel-mid">
    <div class="mode-tabs">
      <button class="mtab active" onclick="setMode('mid','flash')">Flashcards</button>
      <button class="mtab" onclick="setMode('mid','exam')">Exam Mode</button>
    </div>
    <div class="unit-filter" id="uf-mid">
      <button class="ufbtn active" onclick="filterUnit('mid','all')">All Units</button>
      <button class="ufbtn" onclick="filterUnit('mid','1')">Unit I</button>

      <button class="ufbtn" onclick="filterUnit('mid','3')">Unit III</button>

      <button class="ufbtn" onclick="filterUnit('mid','5')">Unit V</button>

    <div class="stats-bar" id="stats-mid"></div>
    <div class="cpanel active" id="mid-flash"><div class="fc-grid" id="fc-mid"></div><div class="fc-count" id="fc-count-mid"></div></div>
    <div class="cpanel" id="mid-exam"><div class="exam-wrap" id="mid-exam-body"></div></div>

  <!-- SEM PANEL -->
  <div class="cpanel" id="panel-sem">
    <div class="mode-tabs">
      <button class="mtab active" onclick="setMode('sem','flash')">Flashcards</button>
      <button class="mtab" onclick="setMode('sem','exam')">Exam Mode</button>
    </div>

      <button class="ufbtn active" onclick="filterUnit('sem','all')">All Units</button>
      <button class="ufbtn" onclick="filterUnit('sem','1')">Unit I</button>
      <button class="ufbtn" onclick="filterUnit('sem','2')">Unit II</button>

<script>
// ================================================================
// ALL FLASHCARDS — 120+ across 5 units
// ================================================================
const FLASHCARDS = [
// ===== UNIT 1: Introduction, Agents, Search =====
{u:'1',tag:'Definition',q:'What is Artificial Intelligence?',a:'AI is the study of designing rational agents that perceive their environment and take actions that maximize their chance of achieving goals.\nBroad goals: make machines think like humans (cognitive), or make them act rationally (rational agent approach).\nTuring Test: if a human cannot distinguish machine responses from human, machine passes.',f:'Rational agent = perceive → think → act optimally'},
{u:'1',tag:'Definition',q:'Define an Intelligent Agent and its components.',a:'An agent is anything that perceives its environment through SENSORS and acts through ACTUATORS.\nComponents:\n• Percept: single input at one moment\n• Percept sequence: history of all inputs\n• Agent function: maps percept sequence to action\n• Agent program: implements the agent function',f:'Agent = Perception + Reasoning + Action'},
{u:'1',tag:'Definition',q:'What is a Rational Agent?',a:'A rational agent selects actions that maximize its expected performance measure, based on:\n1. Performance measure (defines success)\n2. Prior knowledge of the environment\n3. Actions available\n4. Percept sequence so far\nRationality ≠ omniscience — rational agents act best with available info.',f:'Rational ≠ perfect. Rational = best expected outcome given what is known.'},
{u:'1',tag:'Definition',q:'Describe the PEAS framework for agent design.',a:'PEAS = Performance measure, Environment, Actuators, Sensors.\nExample (Self-driving car):\n• P: Safety, speed, legal compliance, passenger comfort\n• E: Roads, traffic, pedestrians, weather\n• A: Steering, brakes, accelerator, horn\n• S: Cameras, GPS, lidar, speedometer\nUsed to fully specify an agent task.',f:'Always define PEAS before designing any AI agent'},
{u:'1',tag:'Definition',q:'What are the types of environments in AI?',a:'Environments classified by:\n• Observable: Fully (see all) vs Partially (limited sensors)\n• Deterministic: next state fully determined vs Stochastic (random)\n• Episodic: actions independent vs Sequential (past affects future)\n• Static: unchanged while agent thinks vs Dynamic\n• Discrete vs Continuous: finite/infinite states and actions\n• Single vs Multi-agent',f:'Real world: Partially observable, stochastic, sequential, dynamic, continuous, multi-agent'},
{u:'1',tag:'Definition',q:'What are the types of agent programs?',a:'1. Simple Reflex Agent: condition-action rules; ignores history\n2. Model-Based Reflex Agent: maintains internal state model\n3. Goal-Based Agent: considers future; plans to reach goal\n4. Utility-Based Agent: maximizes expected utility (happiness measure)\n5. Learning Agent: improves over time via feedback',f:'Simple → Model → Goal → Utility → Learning (increasing power)'},
{u:'1',tag:'Definition',q:'Define a Problem-Solving Agent and its components.',a:'A problem-solving agent formulates goals and problems, then searches for a solution.\nProblem components:\n• Initial state: where agent starts\n• Actions: set of possible moves\n• Transition model: RESULT(s,a)\n• Goal test: is state s a goal?\n• Path cost: numeric cost of path\nSolution = sequence of actions from initial to goal state.',f:'Well-defined problem = all 5 components specified'},
{u:'1',tag:'Algorithm',q:'Explain Breadth-First Search (BFS).',a:'Explores all nodes at depth d before depth d+1. Uses a QUEUE (FIFO).\n• Complete: Yes (finds solution if it exists)\n• Optimal: Yes (if all costs equal)\n• Time: O(b^d) where b=branching factor, d=depth\n• Space: O(b^d) — stores all frontier nodes\nProb: exponential memory for large depths.',f:'BFS: queue, finds shortest path (unweighted), memory-hungry'},
{u:'1',tag:'Algorithm',q:'Explain Depth-First Search (DFS).',a:'Explores deepest node first. Uses a STACK (LIFO).\n• Complete: No (may get stuck in infinite loops)\n• Optimal: No\n• Time: O(b^m) where m=max depth\n• Space: O(bm) — only stores current path!\nAdvantage: very memory-efficient. Used with depth limit to avoid infinite loops.',f:'DFS: stack, memory-efficient O(bm), not complete'},
{u:'1',tag:'Algorithm',q:'Explain Uniform Cost Search (UCS).',a:'Expands node with lowest PATH COST g(n). Uses a priority queue.\n• Complete: Yes\n• Optimal: Yes (finds minimum cost path)\n• Time: O(b^(1+C*/ε)) where C*=optimal cost, ε=min edge cost\n• Space: Same as time\nSame as Dijkstra\'s algorithm for single-source shortest path.',f:'UCS = Dijkstra: expands cheapest-cost node first'},
{u:'1',tag:'Algorithm',q:'Explain Iterative Deepening DFS (IDDFS).',a:'Combines DFS space efficiency with BFS completeness.\nRuns DFS with depth limit L=0,1,2,... until goal found.\n• Complete: Yes\n• Optimal: Yes (if equal step costs)\n• Time: O(b^d) — repeated work is small fraction\n• Space: O(bd) — just like DFS\nBest uninformed search for unknown depth problems!',f:'IDDFS = BFS completeness + DFS memory efficiency'},
{u:'1',tag:'Algorithm',q:'Explain Bidirectional Search.',a:'Runs two simultaneous searches: one forward from start, one backward from goal. Stops when they meet in the middle.\n• Reduces complexity from O(b^d) to O(b^(d/2))\n• Complete: Yes\n• Optimal: Yes (with equal costs)\nRequirement: must be able to generate predecessors (backward search).',f:'Bidirectional: two frontiers meet in middle = b^(d/2) vs b^d'},
{u:'1',tag:'Comparison',q:'Compare uninformed search strategies.',a:'Strategy | Complete | Optimal | Time | Space\nBFS | Yes | Yes* | b^d | b^d\nDFS | No | No | b^m | bm\nUCS | Yes | Yes | b^(C*/e) | b^(C*/e)\nIDS | Yes | Yes* | b^d | bd\nBidir | Yes | Yes* | b^(d/2) | b^(d/2)\n*if equal step costs. b=branching, d=depth, m=max depth',f:'IDS best in practice for unknown depths; UCS for weighted graphs'},
{u:'1',tag:'Algorithm',q:'Explain Greedy Best-First Search.',a:'Informed search using heuristic h(n) = estimated cost to goal.\nExpands node with LOWEST h(n).\n• Complete: No (can get stuck in loops)\n• Optimal: No\n• Time/Space: O(b^m) worst case\nHeuristic guides search toward goal quickly but may not find optimal path.',f:'Greedy: uses h(n) only — fast but not optimal'},
{u:'1',tag:'Algorithm',q:'Explain A* Search.',a:'Best known informed search. Evaluates nodes by: f(n) = g(n) + h(n)\n• g(n) = cost so far (from start)\n• h(n) = estimated cost to goal (heuristic)\n• f(n) = total estimated cost\nComplete: Yes | Optimal: Yes if h is ADMISSIBLE (never overestimates)\nTime/Space: Exponential in worst case but efficient with good heuristics.',f:'A* = g(n) + h(n); admissible h → optimal; consistent h → efficient'},
{u:'1',tag:'Definition',q:'What is an Admissible Heuristic?',a:'A heuristic h(n) is admissible if it NEVER OVERESTIMATES the true cost to reach the goal.\nh(n) ≤ h*(n) for all nodes n.\nGuarantees A* finds optimal solution.\nExample: Straight-line distance (Euclidean) for road navigation — actual road distance ≥ straight-line.',f:'Admissible: h(n) ≤ h*(n) → A* is optimal'},
{u:'1',tag:'Definition',q:'What is a Consistent (Monotone) Heuristic?',a:'h(n) is consistent if for every node n and successor n\' via action a:\nh(n) ≤ c(n,a,n\') + h(n\')\n(Triangle inequality)\nConsistency → Admissibility. Consistent heuristic ensures A* never reopens a closed node, making it more efficient.',f:'Consistent: h(n) ≤ cost(n,n\') + h(n\') → A* closes nodes optimally'},
{u:'1',tag:'Definition',q:'What are Heuristic Functions? Give examples for 8-puzzle.',a:'Heuristic functions estimate cost from current state to goal.\nFor 8-puzzle:\n• h1 = number of misplaced tiles (admissible)\n• h2 = Manhattan distance: Σ|row_diff|+|col_diff| (admissible, dominates h1)\nDomination: h2 ≥ h1 for all n → h2 expands fewer nodes → better heuristic.',f:'h2 (Manhattan) dominates h1 (misplaced) → fewer nodes expanded'},
{u:'1',tag:'Algorithm',q:'Explain Hill-Climbing Search.',a:'Local search: moves to neighbor with highest value (steepest ascent).\nNo memory of where it\'s been.\nProblems:\n• Local maxima: peaks that aren\'t global optimal\n• Ridges: plateau with poor directions\n• Plateaux: flat areas where all neighbors equal\nSolutions: random restart, sideways moves, stochastic hill climbing.',f:'Hill climbing: gradient ascent, gets stuck at local maxima'},
{u:'1',tag:'Algorithm',q:'Explain Simulated Annealing.',a:'Based on metallurgical annealing. Allows occasional DOWNHILL moves to escape local optima.\n• Temperature T starts high (many bad moves allowed)\n• T decreases over time (schedule)\n• Bad move accepted with probability e^(ΔE/T)\nAs T→0, behaves like hill-climbing.\nGuaranteed optimal if cooling is slow enough.',f:'SA: e^(ΔE/T) probability of bad move; T→0 means fewer bad moves'},
{u:'1',tag:'Definition',q:'What is Local Search? How does it differ from systematic search?',a:'Local search: keeps only CURRENT state; explores neighbors.\n• No path tracking — not concerned with path to solution\n• Very memory efficient O(1)\n• Used when the solution state IS the answer (e.g., 8-queens)\n• Cannot guarantee finding solution (incomplete)\nSystematic search: keeps frontier, finds guaranteed paths.\nExamples of local search: Hill climbing, SA, Genetic algorithms, Beam search.',f:'Local search: memory O(1), solves state-space optimization problems'},

// ===== UNIT 2: Adversarial Search, CSP, Propositional Logic =====
{u:'2',tag:'Definition',q:'What is Adversarial Search? Define a Game formally.',a:'Adversarial search involves two or more agents with conflicting goals (games).\nFormal game = (S, A, P, T, U, Γ) where:\n• S = states, A = actions\n• P = players, T = terminal test\n• U = utility function\n• Γ = initial state\nZero-sum games: one player\'s gain = other\'s loss.',f:'Games: multi-agent, adversarial, competitive environments'},
{u:'2',tag:'Algorithm',q:'Explain the Minimax Algorithm.',a:'For 2-player zero-sum games. MAX player maximizes utility, MIN player minimizes.\nMINIMAX-VALUE(n):\n• If terminal: return utility(n)\n• If MAX node: return max over children MINIMAX-VALUE(child)\n• If MIN node: return min over children MINIMAX-VALUE(child)\nComplete: Yes. Optimal: Yes (against optimal opponent).\nTime: O(b^m). Space: O(bm).',f:'Minimax: MAX maximizes, MIN minimizes; optimal vs optimal opponent'},
{u:'2',tag:'Algorithm',q:'Explain Alpha-Beta Pruning.',a:'Optimization of minimax. Prunes branches that cannot affect final decision.\n• α = best value MAX can guarantee (starts -∞)\n• β = best value MIN can guarantee (starts +∞)\nPrune when: α ≥ β\n• MAX node: update α = max(α, value)\n• MIN node: update β = min(β, value)\nEffective branching factor: b^(d/2) instead of b^d.',f:'α-β: prune when α≥β; effective depth doubles with same time'},
{u:'2',tag:'Definition',q:'What is a Constraint Satisfaction Problem (CSP)?',a:'CSP defined by:\n• Variables: X = {X1,...,Xn}\n• Domains: D = {D1,...,Dn}\n• Constraints: C = {C1,...,Cm}\nGoal: find assignment of values to ALL variables satisfying ALL constraints.\nExamples: Map coloring, n-queens, Sudoku, scheduling.',f:'CSP: variables + domains + constraints; find consistent assignment'},
{u:'2',tag:'Algorithm',q:'Explain Backtracking Search for CSPs.',a:'Systematic DFS for CSP. Assigns one variable at a time, backtracks when conflict detected.\nImprovements:\n1. MRV (Minimum Remaining Values): choose var with fewest legal values\n2. Degree heuristic: choose var with most constraints on remaining\n3. LCV (Least Constraining Value): choose value that eliminates fewest options\n4. Forward checking: propagate constraints after each assignment',f:'Backtracking + MRV + LCV + forward checking = efficient CSP solving'},
{u:'2',tag:'Algorithm',q:'Explain Constraint Propagation in CSPs.',a:'Reduces domains before/during search by enforcing consistency.\n• Node consistency: unary constraints satisfied\n• Arc consistency (AC-3): for every pair (Xi,Xj), every value in Di has support in Dj\n• Path consistency: triples of variables consistent\nAC-3 algorithm runs in O(cd³) time.\nReduces search space significantly before backtracking.',f:'AC-3: remove value from Xi if no consistent value exists in Xj'},
{u:'2',tag:'Definition',q:'What is a Knowledge-Based Agent?',a:'Agent with a KNOWLEDGE BASE (KB) — a set of sentences in formal language.\n• Tell: add new sentences to KB\n• Ask: query what the KB entails\n• Inference: derive new sentences from existing ones\nKB must be: Sound (only valid inferences) and Complete (can derive everything entailed).',f:'KB agent: Tell → Reason → Ask → Act'},
{u:'2',tag:'Definition',q:'Describe the Wumpus World.',a:'Grid world with Wumpus (monster), pits, and gold.\nAgent senses: Stench (Wumpus nearby), Breeze (pit nearby), Glitter (gold here), Bump, Scream.\nProperties: Partially observable, deterministic, sequential, static, discrete, single-agent.\nAgent must reason logically from percepts to find gold and exit safely.',f:'Wumpus: classic KB agent testbed. Breeze→pit nearby; Stench→Wumpus nearby'},
{u:'2',tag:'Definition',q:'Define Propositional Logic syntax and semantics.',a:'Syntax: Atomic sentences (P,Q), complex via connectives:\n• ¬ (NOT), ∧ (AND), ∨ (OR), ⇒ (IMPLIES), ⟺ (BICONDITIONAL)\nSemantics: Sentence true/false given model (truth assignment).\n• P⇒Q: false only if P=true and Q=false\n• Equivalent to ¬P∨Q\nModel: truth assignment to all propositional symbols.',f:'P⇒Q ≡ ¬P∨Q. Only false when P=T and Q=F'},
{u:'2',tag:'Definition',q:'What is Propositional Theorem Proving?',a:'Deciding if KB ⊨ α (KB entails α) — α is true in all models where KB is true.\nMethods:\n1. Model checking: enumerate all models (2^n for n symbols)\n2. Proof: apply inference rules to KB to derive α\nKey property: Entailment = truth in all models of KB.',f:'KB ⊨ α iff α is true in every model of KB'},
{u:'2',tag:'Algorithm',q:'Explain Resolution Inference in Propositional Logic.',a:'Resolution rule: (P ∨ Q) and (¬Q ∨ R) → (P ∨ R)\nProof by refutation:\n1. Convert all sentences to CNF (Conjunctive Normal Form)\n2. Negate the goal α\n3. Add ¬α to KB\n4. Apply resolution until empty clause (contradiction) or no new clauses\nEmpty clause = contradiction → KB ⊨ α proved!',f:'Resolution: refutation-complete. Find contradiction with ¬goal'},
{u:'2',tag:'Definition',q:'What are Horn Clauses? Why are they important?',a:'Horn clause: at most ONE positive literal.\nTypes:\n• Definite clause: exactly one positive: (¬A ∨ ¬B ∨ C) = A∧B⇒C\n• Fact: no negative literals: just C\nImportant because: Forward and backward chaining are LINEAR-TIME for Horn KBs.\nProlog is based on Horn clause logic.',f:'Horn: A∧B∧C ⇒ D. At most 1 positive literal per clause'},
{u:'2',tag:'Algorithm',q:'Explain Forward and Backward Chaining.',a:'Forward chaining (data-driven):\nStart from known facts, apply rules to derive new facts, stop when goal reached.\nLinear time for Horn clauses.\n\nBackward chaining (goal-driven):\nStart from goal, find rules whose conclusion matches, try to prove premises.\nAvoids irrelevant conclusions.\nUsed in logic programming (Prolog).',f:'Forward: facts→goal. Backward: goal→facts. Both linear for Horn KBs'},

// ===== UNIT 3: First-Order Logic, Inference in FOL =====
{u:'3',tag:'Definition',q:'What is First-Order Logic (FOL)?',a:'More expressive than propositional logic. Includes:\n• Objects: constants (John, Mary), variables (x,y)\n• Predicates: properties/relations (Loves(x,y), Parent(x,y))\n• Functions: map objects to objects (father(John))\n• Quantifiers: ∀ (for all), ∃ (there exists)\nSemantics: interpretation assigns objects to constants, relations to predicates.',f:'FOL: objects + predicates + functions + quantifiers'},
{u:'3',tag:'Definition',q:'Explain Universal and Existential Quantifiers in FOL.',a:'Universal (∀): ∀x P(x) = P is true for ALL objects.\n∀x Loves(x, iceCream) = Everyone loves ice cream\n\nExistential (∃): ∃x P(x) = P is true for AT LEAST ONE object.\n∃x Crown(x) = At least one crown exists\n\nDuality: ¬∀x P(x) ≡ ∃x ¬P(x)\n¬∃x P(x) ≡ ∀x ¬P(x)',f:'∀: for all. ∃: there exists. ¬∀x P ≡ ∃x ¬P'},
{u:'3',tag:'Definition',q:'What is Substitution in FOL?',a:'Substitution θ = {var1/term1, var2/term2,...} replaces variables with terms.\nF[a/x] = substitute constant a for variable x in formula F.\nExample: Loves(x,y)[John/x, Mary/y] = Loves(John,Mary)\nUsed in all inference systems in FOL to instantiate variables.',f:'F[a/x] = replace every occurrence of x with a in F'},
{u:'3',tag:'Definition',q:'Explain Universal Instantiation (UI) and Existential Instantiation (EI).',a:'Universal Instantiation (UI):\n∀x P(x) → P(c) for any constant c.\nApply multiple times for different substitutions.\n\nExistential Instantiation (EI):\n∃x P(x) → P(k) where k is a NEW Skolem constant.\nApplied only ONCE per existential statement.\nNew KB not logically equivalent to old but satisfiable if old was satisfiable.',f:'UI: ∀x P(x) → P(c). EI: ∃x P(x) → P(k) (Skolem constant)'},
{u:'3',tag:'Definition',q:'What is Unification in FOL?',a:'Unification finds a substitution θ (unifier) that makes two expressions identical.\nMost General Unifier (MGU): simplest unifier, most flexible.\nExample: UNIFY(Knows(John,x), Knows(John,Jane)) = {x/Jane}\nFails if: constant vs different constant, or occurs check fails (x=f(x) fails).\nUsed in resolution and backward chaining.',f:'MGU: most general substitution making two expressions identical'},
{u:'3',tag:'Algorithm',q:'How do you convert FOL to Conjunctive Normal Form (CNF)?',a:'Steps:\n1. Eliminate biconditionals (⟺) and implications (⇒)\n2. Move ¬ inward (De Morgan\'s laws, double negation)\n3. Standardize variables (rename to make unique)\n4. Skolemize: ∃x P(x) → P(c) or P(f(y)) for ∃x depending on ∀ context\n5. Drop universal quantifiers\n6. Distribute ∨ over ∧ to get CNF',f:'CNF conversion: eliminate ⇒ → move ¬ → Skolemize → distribute'},
{u:'3',tag:'Algorithm',q:'Explain Resolution in First-Order Logic.',a:'FOL Resolution:\n1. Convert KB + ¬goal to CNF\n2. Find two clauses with complementary literals after unification\n3. Apply MGU to unify, create resolvent\n4. Repeat until empty clause (= proof found) or no new clauses\nExample:\n• P(x) ∨ Q(x) and ¬P(a) ∨ R(a)\n• Unify P(x) with P(a): θ={x/a}\n• Resolvent: Q(a) ∨ R(a)',f:'FOL resolution: unify complementary literals, resolve, repeat until □'},
{u:'3',tag:'Algorithm',q:'Explain Forward Chaining in FOL.',a:'Data-driven proof strategy for definite clauses (Horn).\n1. Start with all known FACTS\n2. Find all rules whose premises are satisfied by known facts\n3. Add conclusions as new facts\n4. Repeat until goal is derived or no new facts can be added\nExample: From Man(John) and ∀x Man(x)⇒Mortal(x), derive Mortal(John).\nSound and complete for FOL Horn clauses.',f:'Forward chaining: facts→apply rules→new facts→goal'},
{u:'3',tag:'Algorithm',q:'Explain Backward Chaining in FOL.',a:'Goal-driven proof for definite clauses.\n1. Start with GOAL\n2. Find rules whose head (conclusion) matches the goal (via unification)\n3. Recursively try to prove the body (premises)\n4. If goal is a known fact, succeed immediately\n5. If no rule applies, fail (backtrack)\nUsed in Prolog. More efficient than FC when only some facts are relevant.',f:'Backward chaining: goal→find rule→prove premises→base facts'},
{u:'3',tag:'Definition',q:'What is Propositional vs First-Order Inference?',a:'Propositional logic:\n• Finite vocabulary of symbols\n• Simple model checking or resolution\n• Semi-decidable: resolution complete for satisfiability\n\nFirst-Order Logic:\n• Infinite domains possible\n• Requires quantifier handling\n• Propositionalisation: ground all universals, apply prop. inference\n• Semi-decidable: if KB⊨α, proof found; if not, may loop forever',f:'FOL: semi-decidable. Propositionalise + resolve works for Horn KBs'},

// ===== UNIT 4: Knowledge Representation, Classical Planning =====
{u:'4',tag:'Definition',q:'What is Ontological Engineering?',a:'Designing general-purpose ontologies (frameworks of categories and concepts).\n• Upper ontology: top-level categories (Objects, Events, Time, Space)\n• Domain ontologies: specific knowledge (medical, legal)\nGoal: reusable, consistent knowledge bases.\nCategories organize the world. Objects belong to categories.',f:'Ontological engineering: upper ontology → domain ontologies → instances'},
{u:'4',tag:'Definition',q:'How are Categories and Objects represented in FOL?',a:'Categories: properties/relations (MemberOf, SubsetOf, PartOf).\n• MemberOf(Fido, Dog) — Fido is a dog\n• SubsetOf(Dog, Animal) — dogs are animals\n• Natural kinds vs Defined categories\nObjects: instances of categories.\nInheritance: if MemberOf(x,C) and SubsetOf(C,D) → MemberOf(x,D).',f:'MemberOf, SubsetOf, PartOf — basic category-object relations'},
{u:'4',tag:'Definition',q:'What are Events in knowledge representation?',a:'Events are things that happen at specific time intervals (unlike objects which persist).\n• Fluents: properties that change over time (e.g., At(Robot,Room))\n• Situation Calculus: represents change using states\n• Frame problem: how to represent that things stay the same after an action\nEventCalculus handles actions, events, and their effects on world state.',f:'Fluents change over time. Frame problem: what persists after actions?'},
{u:'4',tag:'Definition',q:'What is Reasoning with Default Information?',a:'Default logic handles TYPICAL cases with exceptions.\n• Default rule: "birds fly" — true unless exception applies\n• Non-monotonic reasoning: adding new info can invalidate old conclusions\nApproaches:\n• Closed-World Assumption: what isn\'t known is false\n• Default Logic (Reiter)\n• Circumscription: minimize what is abnormal',f:'Non-monotonic: new facts can retract old conclusions (unlike classical logic)'},
{u:'4',tag:'Definition',q:'What is Classical Planning?',a:'Planning: finding a sequence of actions to achieve a goal from an initial state.\nClassical planning assumptions:\n• Fully observable environment\n• Deterministic actions\n• Finite set of actions and states\n• Single agent\nRepresentation: PDDL (Planning Domain Definition Language) / STRIPS.',f:'Classical planning: PDDL, deterministic, fully observable, find action sequence'},
{u:'4',tag:'Definition',q:'Explain STRIPS/PDDL representation.',a:'PDDL (based on STRIPS) describes:\n• Initial state: conjunction of ground atoms (At(Robot,Kitchen))\n• Goal: conjunction of literals to achieve\n• Actions: with PRECONDITIONS and EFFECTS\nAction schema: name + variables + precondition + effect\nClosed-world assumption: unmentioned atoms are FALSE.\nFluents: predicates that can change.',f:'PDDL action: Precondition (must hold) → Effect (changes state)'},
{u:'4',tag:'Example',q:'Give the robot navigation PDDL example.',a:'Problem: robot moves kitchen→hall→bedroom\nAction: Move(robot, from, to)\n• Precondition: At(robot,from) ∧ Connected(from,to)\n• Effect: ¬At(robot,from) ∧ At(robot,to)\nInitial: At(robot,kitchen)\nGoal: At(robot,bedroom)\nPlan: Move(robot,kitchen,hall) → Move(robot,hall,bedroom)',f:'PDDL: preconditions must hold; effects change world state'},
{u:'4',tag:'Algorithm',q:'Explain Forward (Progression) State-Space Search for Planning.',a:'Start from initial state, apply actions, generate successor states.\n1. Current state = initial state, plan = []\n2. Find all applicable actions (preconditions satisfied)\n3. Apply action, compute new state (add/remove fluents)\n4. Repeat until goal state reached\n• Complete: Yes | Optimal with appropriate search (A*)\n• Problem: large branching factor',f:'Forward search: initial→apply actions→check goal. Use heuristics!'},
{u:'4',tag:'Algorithm',q:'Explain Backward (Regression) State-Space Search.',a:'Starts from GOAL, works backward using inverse actions.\n1. Current goal = planning goal\n2. Find relevant actions (head of action matches part of goal)\n3. Regress: new goal = (goal - effect) ∪ precondition\n4. Repeat until current goal ⊆ initial state\nAdvantage: only considers RELEVANT actions — more focused search.',f:'Backward search: goal→relevant actions→regress→initial state'},
{u:'4',tag:'Definition',q:'What is a Planning Graph?',a:'Special data structure for heuristic estimation and GRAPHPLAN algorithm.\nAlternating layers of:\n• Literal layers (S0, S1...): sets of propositions\n• Action layers (A0, A1...): applicable actions\nMutex relations: actions/literals that cannot coexist.\nUsed by GRAPHPLAN algorithm to find plans.',f:'Planning graph: S0→A0→S1→A1→S2→... with mutex links'},
{u:'4',tag:'Definition',q:'What are Mutex Relations in Planning Graphs?',a:'Two actions are mutex if:\n1. Inconsistent effects: one negates effect of other\n2. Interference: one deletes precondition of other\n3. Competing needs: preconditions are mutex\nTwo literals are mutex if:\n1. Inconsistent support: all achieving actions are pairwise mutex\nMutex prevents GRAPHPLAN from producing invalid plans.',f:'Mutex: actions cannot execute simultaneously; literals cannot both hold'},
{u:'4',tag:'Definition',q:'Explain the Blocks World planning problem.',a:'Classic planning domain:\n• Blocks on a table, one block on top of another at most\n• Robot arm picks up ONE block at a time (can\'t pick block with block on top)\nTypical goal: stack blocks in specific order\nActions: Move(x,y) — put x on y; MoveToTable(x,y) — put x on table\nExample plan: [MoveToTable(C,A), Move(B,Table,C), Move(A,Table,B)]',f:'Blocks world: Move(x,y) with precondition Clear(x) ∧ Clear(y)'},

// ===== UNIT 5: Probability, Bayesian Networks =====
{u:'5',tag:'Definition',q:'What is Uncertainty in AI? Why does it arise?',a:'Uncertainty: agent cannot be completely certain about world state.\nCauses:\n• Sensors have limited precision and accuracy\n• Hidden variables sensors cannot detect\n• Future is unknown and unpredictable\n• Incomplete theoretical knowledge\nSolution: use PROBABILITY THEORY to represent degrees of belief.',f:'Uncertainty → probability theory instead of Boolean logic'},
{u:'5',tag:'Definition',q:'What is the toothache-cavity problem in uncertainty?',a:'Why propositional logic fails:\n• Toothache ⇒ Cavity (wrong — not all toothaches = cavity)\n• Cavity ⇒ Toothache (wrong — not all cavities cause pain)\nProbabilistic approach:\nP(Cavity|Toothache) = 0.8\n"If toothache, cavity with probability 0.8"\nAgent acts on degree of belief, not absolute truth.',f:'Logic fails with exceptions. Probability handles graded beliefs'},
{u:'5',tag:'Definition',q:'State the Axioms of Probability.',a:'1. 0 ≤ P(ω) ≤ 1 for all outcomes ω\n2. Σ P(ω) = 1 (probabilities sum to 1)\n3. P(A∨B) = P(A) + P(B) - P(A∧B) (addition rule)\nConditional probability: P(A|B) = P(A∧B)/P(B)\nComplement: P(¬A) = 1 - P(A)',f:'P(A|B) = P(A∧B)/P(B). Sum of all possibilities = 1'},
{u:'5',tag:'Definition',q:'What is the Full Joint Probability Distribution?',a:'Complete specification of probabilities for ALL combinations of random variables.\nFor n boolean variables: 2^n entries.\nExample: P(Cavity, Toothache, Catch) = 2^3 = 8 entries.\nAny query answerable from full joint: P(A) = Σ P(A, other vars)\nProblem: exponential size; 2^n entries for n variables.',f:'Full joint: 2^n entries. Sum over hidden variables = marginalization'},
{u:'5',tag:'Definition',q:'What is Marginal Probability and how is it computed?',a:'Marginal probability: probability of one variable without conditioning on others.\nP(A) = Σ_b P(A, B=b) — sum (marginalize) over all values of B.\nExample: P(Cavity) = P(Cavity,Toothache) + P(Cavity,¬Toothache)\nAlso called summing out or marginalization.',f:'P(A) = Σ_b P(A,B=b) — sum out (marginalize) other variables'},
{u:'5',tag:'Definition',q:'What is Conditional Independence?',a:'X is conditionally independent of Y given Z if:\nP(X|Y,Z) = P(X|Z)\nKnowing Z makes Y irrelevant for X.\nExample: P(Weather|Cavity, Toothache) = P(Weather) — weather is independent of dental facts.\nReduces computation: instead of full joint, use products of smaller tables.',f:'P(X|Y,Z)=P(X|Z): Z makes Y irrelevant for X. Enables efficiency'},
{u:'5',tag:'Definition',q:'State Bayes\' Rule and explain its importance.',a:'P(cause|effect) = [P(effect|cause) × P(cause)] / P(effect)\n\nDiagnostic direction: P(disease|symptom)\n= [P(symptom|disease) × P(disease)] / P(symptom)\n\nWhy important:\n• Easier to specify P(effect|cause) than P(cause|effect)\n• Allows updating beliefs given new evidence\n• Foundation of Bayesian inference',f:'Bayes: P(A|B) = P(B|A)×P(A)/P(B). Causal→diagnostic'},
{u:'5',tag:'Definition',q:'What is a Bayesian Network (Belief Network)?',a:'Directed Acyclic Graph (DAG) representing conditional dependencies:\n• Nodes: random variables\n• Edges: direct causal/influence relationships\n• Each node has a Conditional Probability Table (CPT): P(Xi|Parents(Xi))\nJoint distribution = Π P(Xi|Parents(Xi))\nCompact representation: far fewer parameters than full joint.',f:'BN: DAG + CPTs. Joint = Π P(Xi|Pa(Xi))'},
{u:'5',tag:'Example',q:'Describe the Burglary-Earthquake Bayesian Network.',a:'Variables: Burglary(B), Earthquake(E), Alarm(A), JohnCalls(J), MaryCalls(M)\nStructure: B→A, E→A, A→J, A→M\nCPTs: P(B), P(E), P(A|B,E), P(J|A), P(M|A)\nQuery: P(J,M,A,¬B,¬E) = P(J|A)×P(M|A)×P(A|¬B,¬E)×P(¬B)×P(¬E)\n= 0.90×0.70×0.001×0.999×0.998 ≈ 0.0000628',f:'BN chain rule: P(X1...Xn) = Π P(Xi|Parents(Xi))'},
{u:'5',tag:'Definition',q:'What is a Conditional Probability Table (CPT)?',a:'Each node Xi in a BN has a CPT giving P(Xi|Parents(Xi)).\nFor a node with k binary parents: 2^k rows in CPT.\nRoot nodes (no parents): just P(Xi) — prior probability.\nLeaf nodes: CPT conditioned on all parents.\nTotal parameters in BN << 2^n (full joint size).',f:'CPT: P(Xi|Parents). Root nodes: prior probabilities P(Xi)'},
{u:'5',tag:'Definition',q:'What is Exact Inference in Bayesian Networks?',a:'Computing P(X|e) exactly.\nMethods:\n1. Inference by enumeration: P(X|e) = α Σ_h P(X,e,h) — sum over hidden\n2. Variable elimination: eliminate variables one by one\n3. Junction tree algorithm\nProblem: exact inference is NP-hard in general BNs.\nApproximate inference needed for large networks.',f:'Exact BN inference: sum over hidden variables. NP-hard generally'},
{u:'5',tag:'Definition',q:'What is Approximate Inference in Bayesian Networks?',a:'For large BNs where exact inference is intractable.\nMethods:\n1. Prior Sampling: sample from prior distribution P(x)\n2. Rejection Sampling: sample from prior, reject if inconsistent with evidence\n3. Likelihood Weighting: fix evidence, weight samples by P(e|parents)\n4. MCMC (Gibbs Sampling): Markov chain simulation',f:'Approx inference: sampling methods for large BNs'},
{u:'5',tag:'Algorithm',q:'Explain Prior Sampling in Bayesian Networks.',a:'Generate samples from the joint distribution defined by BN.\n1. Order nodes topologically\n2. For each node, sample from P(Xi|sampled parents)\n3. Repeat N times\n4. Estimate P(Q) ≈ count(Q in samples)/N\nSimple but inefficient when evidence is rare (most samples rejected).',f:'Prior sampling: topological order, sample P(Xi|parents), count results'},
{u:'5',tag:'Algorithm',q:'Explain Rejection Sampling.',a:'Sample from prior distribution, then REJECT samples not matching evidence.\n1. Generate N prior samples\n2. Keep only samples consistent with evidence E=e\n3. Estimate P(Q|e) from kept samples\nProblem: if P(e) is small, most samples rejected → inefficient.\nBetter: Likelihood Weighting.',f:'Rejection: sample prior, discard ≠ evidence. Inefficient for rare evidence'},
{u:'5',tag:'Algorithm',q:'Explain Likelihood Weighting.',a:'Fix evidence variables, sample only non-evidence variables.\n1. For each sample:\n   • Set evidence variables to observed values\n   • Sample non-evidence variables from P(Xi|parents)\n   • Weight sample by P(Evidence|parents)\n2. Estimate P(Q|e) = weighted sum\nMore efficient than rejection sampling — no samples wasted.',f:'Likelihood weighting: fix evidence, weight by P(e|parents). No rejection'},
{u:'5',tag:'Algorithm',q:'Explain Gibbs Sampling (MCMC for BNs).',a:'Markov Chain Monte Carlo method.\n1. Fix evidence variables\n2. Initialize other variables randomly\n3. Repeatedly: pick random non-evidence variable Xi\n   • Sample Xi from P(Xi|Markov_blanket(Xi))\n4. After burn-in, collect samples\nMarkov blanket of Xi = parents + children + other parents of children\nConverges to true posterior P(Q|e).',f:'Gibbs: sample Xi|Markov_blanket(Xi). Blanket=parents+children+co-parents'},
{u:'5',tag:'Definition',q:'What is the Markov Blanket of a node?',a:'Markov blanket of node X = Parents(X) + Children(X) + Other Parents of Children(X)\nKey property: X is conditionally independent of all other nodes given its Markov blanket.\nP(X|all others) = P(X|Markov_blanket(X))\nUsed in Gibbs sampling to sample each variable efficiently.',f:'Markov blanket: parents + children + co-parents = minimal conditioning set'},
{u:'5',tag:'Definition',q:'What is Dempster-Shafer Theory?',a:'Evidence theory for managing uncertainty when information is incomplete or conflicting.\n• Assigns belief to SETS of outcomes (not just single outcomes)\n• Belief function Bel(A) = direct evidence for A\n• Plausibility Pl(A) = 1 - Bel(¬A)\n• Dempster\'s rule: combine evidence from independent sources\nDiffers from Bayes: handles ignorance explicitly (unknowns ≠ 50/50).',f:'D-S theory: belief mass on sets; handles ignorance unlike Bayes'},
{u:'5',tag:'Definition',q:'What is Utility Theory in decision making?',a:'Every state has a degree of usefulness = UTILITY.\nAgent prefers states with higher utility.\nDecision Theory = Probability Theory + Utility Theory.\nMaximum Expected Utility (MEU):\nA rational agent chooses action that MAXIMIZES expected utility:\nEU(a) = Σ P(result|a) × U(result)\nAct to maximize EU!',f:'MEU: choose action maximizing Σ P(outcome|action) × U(outcome)'},
{u:'5',tag:'Definition',q:'What is Naive Bayes? When is it used?',a:'Assumes all features are conditionally independent given the class:\nP(X1,...,Xn|C) = Π P(Xi|C)\nClassifier: argmax_c P(C=c) × Π P(Xi|C=c)\nWhy "naive": the independence assumption rarely holds exactly.\nBut works remarkably well in practice!\nApplications: spam filtering, text classification, medical diagnosis.',f:'Naive Bayes: P(X1...Xn|C)=ΠP(Xi|C). Simple, fast, surprisingly effective'},
// Additional Unit 1 cards
{u:'1',tag:'Algorithm',q:'What is Beam Search?',a:'Local search variant keeping k states (beam) instead of just one.\nAt each step, expand all k states, keep the k best successors.\nk=1: greedy hill climbing. k=∞: BFS\nAdvantage over hill climbing: more diverse search.\nStochastic beam search: select k successors with probability proportional to their value.',f:'Beam search: keep k best at each level. Between hill climbing and BFS'},
{u:'2',tag:'Definition',q:'What is the Minimax Theorem and its limitations?',a:'Minimax finds optimal strategy for both players in zero-sum 2-player games.\nLimitations:\n• Only for zero-sum 2-player perfect-info games\n• Exponential time O(b^m)\n• Not directly applicable to partial-info games\nSolution for imperfect real-time: use evaluation function + cutoff depth instead of complete minimax search.',f:'Minimax: optimal for 2-player zero-sum perfect info. Too slow for real games'},
{u:'2',tag:'Definition',q:'Explain Imperfect Real-Time Decisions (EVAL function).',a:'For games too deep for complete search:\n• Use depth-limited search (cutoff test)\n• Apply evaluation function EVAL to non-terminal states\nGood EVAL function properties:\n1. Agrees with utility at terminal states\n2. Quickly computable\n3. Accurately reflects actual chances of winning\nExample: in Chess, material value + positional value.',f:'EVAL: heuristic estimate of position value at non-terminal states'},
{u:'3',tag:'Definition',q:'What is Skolemization in FOL?',a:'Process of eliminating existential quantifiers.\n• Simple existential: ∃x P(x) → P(c) where c is a new Skolem constant\n• Existential under universal: ∀y ∃x P(x,y) → ∀y P(f(y),y) where f is a new Skolem function\nSkolem constant/function represents "the witness" for the existential.\nRequired step in converting FOL to CNF.',f:'Skolemization: ∃x P(x)→P(c); ∀y∃x P(x,y)→∀y P(f(y),y)'},
{u:'4',tag:'Definition',q:'What is the difference between logical, problem-solving, and planning agents?',a:'Logical agent: derives actions from logical conclusions in KB.\nProblem-solving agent: selects best path to goal in current situation.\nPlanning agent: computes sequence of actions considering future states and constraints.\nExample: self-driving car plans route considering future traffic and obstacles.',f:'Planning > problem-solving > logical in terms of future consideration'},
{u:'5',tag:'Definition',q:'What is the Independence assumption in probability?',a:'A and B are independent if:\nP(A|B) = P(A), equivalently P(A∧B) = P(A)×P(B)\nConditional independence: P(A|B,C) = P(A|C)\nImportance: drastically reduces parameters needed.\nFor n independent binary variables: n parameters (vs 2^n for full joint).',f:'Independence: P(A∧B)=P(A)×P(B). Conditional: P(A|B,C)=P(A|C)'},
];

const PARTA_BANK = [
  {id:'a1',u:'1',q:'Which search algorithm guarantees the optimal solution when step costs are equal?',opts:['Depth-First Search','Breadth-First Search','Hill Climbing','Greedy Best-First Search'],ans:1,explain:'BFS expands nodes level by level. With equal step costs, the first solution found is at minimum depth, which corresponds to minimum path cost — hence optimal.',wrongs:['DFS does not find shortest path','Hill climbing is a local search — no completeness guarantee','Greedy uses heuristic, not path cost']},
  {id:'a2',u:'1',q:'The heuristic h(n) = straight-line distance to goal is admissible because:',opts:['It always overestimates','Actual road distance ≥ straight-line distance, so it never overestimates','It ignores path cost','It is the exact cost'],ans:1,explain:'Admissible means h(n) ≤ h*(n). Straight-line (Euclidean) distance is always ≤ actual road distance. You cannot travel shorter than the straight line. Hence it never overestimates → admissible.',wrongs:['Admissible = never overestimate, not overestimate','This is the correct explanation of admissibility','Path cost g(n) is separate from h(n)','It estimates, not computes exactly']},
  {id:'a3',u:'1',q:'Which uninformed search strategy has the best space complexity?',opts:['BFS','UCS','DFS','IDDFS'],ans:2,explain:'DFS space complexity is O(bm) — only the current path from root to deepest node is stored. BFS and UCS store all frontier nodes O(b^d). IDDFS is O(bd) but DFS is O(bm) where m can be large.',wrongs:['BFS stores entire frontier: O(b^d) — poor space','UCS similar to BFS in space','IDDFS is O(bd) which is slightly more than DFS O(bm) in practice']},
  {id:'a4',u:'1',q:'In A* search, f(n) = g(n) + h(n). What does g(n) represent?',opts:['Estimated cost from n to goal','Actual cost from start to n','Total estimated path cost','Heuristic estimate'],ans:1,explain:'g(n) = the actual accumulated cost from the start state to node n along the path taken. h(n) is the heuristic estimate from n to goal. f(n) = g(n) + h(n) = total estimated path cost.',wrongs:['That is h(n)','Correct — g(n) is actual cost from start','That is f(n) = g(n) + h(n)','That is h(n)']},
  {id:'a5',u:'1',q:'Simulated Annealing accepts a worse move with probability:',opts:['0 always','1 always','e^(ΔE/T)','ΔE/T'],ans:2,explain:'SA accepts downhill moves with probability e^(ΔE/T) where ΔE < 0 (worse move), T = temperature. High T → accepts many bad moves. T→0 → like hill climbing (rarely accepts bad moves).',wrongs:['Hill climbing never accepts worse moves','Always accept = random walk','e^(ΔE/T) is the Boltzmann factor used in SA','ΔE/T is not a valid probability formula']},
  {id:'a6',u:'2',q:'In Minimax, a MIN node selects:',opts:['Maximum value among children','Minimum value among children','Average value','A random child'],ans:1,explain:'MIN player chooses the move that MINIMIZES the utility (helps MIN win). MAX player chooses the move that MAXIMIZES utility. The names describe what each player does.',wrongs:['MAX node picks maximum, not MIN','Correct — MIN minimizes','Average is not used in minimax','Minimax is deterministic, not random']},
  {id:'a7',u:'2',q:'Alpha-Beta pruning prunes a branch when:',opts:['α > h(n)','α ≥ β','f(n) > cost_bound','depth > cutoff'],ans:1,explain:'Alpha-Beta pruning: prune when α ≥ β. α = best value MAX can guarantee (lower bound on MAX). β = best value MIN can guarantee (upper bound on MIN). When α ≥ β, MIN would never allow this path.',wrongs:['α>h(n) is not the pruning condition','Correct — prune when α ≥ β','Depth cutoff is separate from alpha-beta','Depth cutoff is not alpha-beta condition']},
  {id:'a8',u:'2',q:'In CSP, the MRV (Minimum Remaining Values) heuristic selects:',opts:['Variable with fewest constraints','Variable with most remaining values','Variable with fewest remaining legal values','Variable assigned most recently'],ans:2,explain:'MRV = fail-first heuristic. Choose the variable with the FEWEST remaining legal values. This detects failure early, pruning large branches. Also called "most constrained variable".',wrongs:['Degree heuristic selects most-constrained variable, MRV selects by domain size','That is the opposite of MRV','Correct — MRV picks variable with smallest remaining domain','Order of assignment is not the MRV criterion']},
  {id:'a9',u:'2',q:'Which connective makes P⇒Q false?',opts:['P=true, Q=true','P=false, Q=true','P=true, Q=false','P=false, Q=false'],ans:2,explain:'Implication P⇒Q is false ONLY when P=True and Q=False (promise broken). In all other cases (P=F, or Q=T), the implication holds. Equivalent to ¬P∨Q.',wrongs:['P=T,Q=T: true (promise kept)','P=F,Q=T: true (vacuously)','Correct — only P=T,Q=F makes implication false','P=F,Q=F: true (vacuously)']},
  {id:'a10',u:'2',q:'Resolution in propositional logic produces an empty clause when:',opts:['KB is satisfiable','A tautology is found','A contradiction is derived (refutation succeeds)','No more rules can be applied'],ans:2,explain:'Resolution by refutation: add ¬α to KB, apply resolution. Empty clause = contradiction. This proves KB ⊨ α. Resolution is refutation-complete: if KB ⊨ α, the empty clause will be derived.',wrongs:['Satisfiable KB means no contradiction','Tautologies are always true — no contradiction','Correct — empty clause = contradiction = proof complete','No new clauses = algorithm terminates, may or may not have proved goal']},
  {id:'a11',u:'3',q:'Universal Instantiation allows:',opts:['∃x P(x) → P(c)','∀x P(x) → P(c) for any constant c','P(c) → ∀x P(x)','∃x P(x) → ∀y P(y)'],ans:1,explain:'UI: from ∀x P(x), derive P(c) for any constant c. The universal statement holds for everything, so it holds for any specific constant. Can be applied multiple times with different constants.',wrongs:['That is Existential Instantiation (EI)','Correct — UI instantiates universal to any constant','That is Universal Generalization (UG) — reverse direction','Cannot generalize from one existential to all']},
  {id:'a12',u:'3',q:'The Most General Unifier (MGU) is:',opts:['The most specific substitution','The most general substitution that makes two expressions identical','The substitution with most variables','The identity substitution'],ans:1,explain:'MGU = most general (least specific) substitution that makes two expressions syntactically identical. "Most general" means it leaves as many variables unbound as possible, enabling more flexible subsequent use.',wrongs:['Most specific would over-constrain variables','Correct — MGU is the most general/flexible unifier','Number of variables is not the criterion','Identity substitution only works if expressions already match']},
  {id:'a13',u:'3',q:'Forward chaining in FOL is best described as:',opts:['Goal-driven, starts from goal','Data-driven, starts from known facts','Random search through KB','Proof by contradiction'],ans:1,explain:'Forward chaining = data-driven. Start with known FACTS, apply rules (modus ponens for Horn clauses) to derive NEW facts, repeat until goal is reached. Bottom-up approach.',wrongs:['Goal-driven = backward chaining','Correct — FC is data-driven, bottom-up','FC is systematic, not random','Proof by contradiction = resolution refutation']},
  {id:'a14',u:'4',q:'In PDDL, the PRECONDITION of an action specifies:',opts:['What the action achieves','What must hold TRUE before the action can be executed','The variables in the action','The cost of the action'],ans:1,explain:'PDDL action schema: Precondition = conjunction of literals that MUST hold for the action to be applicable. Effect = what changes after execution (add/delete list).',wrongs:['That is the EFFECT','Correct — precondition must hold before action executes','Variables are in the action signature/parameters','PDDL basic form does not specify cost by default']},
  {id:'a15',u:'4',q:'Forward state-space search in planning starts from:',opts:['The goal state','The middle of the state space','The initial state','The most recent state'],ans:2,explain:'Forward (progression) search: start from INITIAL state, apply applicable actions, generate successor states, continue until GOAL state is reached. Opposite is backward (regression) search.',wrongs:['Backward search starts from goal','State space has no defined middle','Correct — forward search starts from initial state','No such concept in forward search']},
  {id:'a16',u:'4',q:'Planning graphs are used to:',opts:['Generate random action sequences','Provide better heuristic estimates for planners','Replace the need for planning altogether','Sort actions by cost'],ans:1,explain:'Planning graphs provide efficient HEURISTIC ESTIMATES of the number of steps to reach the goal. GRAPHPLAN algorithm searches the planning graph directly. Better than simplistic heuristics.',wrongs:['Planning graphs are systematic, not random','Correct — better heuristics from planning graphs','Planning graphs support planning, not replace it','Cost-sorting is a different heuristic method']},
  {id:'a17',u:'5',q:'P(A|B) = P(A∧B) / P(B) defines:',opts:['Joint probability','Marginal probability','Conditional probability','Prior probability'],ans:2,explain:'Conditional probability: P(A|B) = P(A∧B)/P(B). The probability of A GIVEN that B is true. P(B) must be > 0. This is the fundamental definition.',wrongs:['P(A∧B) is joint probability','P(A) = Σ P(A,B=b) is marginal','Correct — this is the definition of conditional probability','P(A) without conditions is prior probability']},
  {id:'a18',u:'5',q:'Bayes\' Rule states that P(cause|effect) equals:',opts:['P(effect) × P(cause)','P(effect|cause) × P(cause) / P(effect)','P(cause) / P(effect|cause)','P(effect|cause) / P(effect)'],ans:1,explain:'Bayes\' Rule: P(A|B) = P(B|A)×P(A)/P(B). For cause-effect: P(cause|effect) = P(effect|cause)×P(cause)/P(effect). Converts from causal direction to diagnostic direction.',wrongs:['Missing normalization by P(effect)','Correct — Bayes rule for diagnostic inference','Inverted formula','Missing prior P(cause)']},
  {id:'a19',u:'5',q:'A Bayesian Network is a:',opts:['Undirected cyclic graph','Directed Acyclic Graph (DAG)','Complete bipartite graph','Decision tree'],ans:1,explain:'BN = Directed Acyclic Graph (DAG). Directed: edges show causal/influence direction (parent→child). Acyclic: no directed cycles, allowing efficient inference. Each node has a CPT.',wrongs:['BN is directed and acyclic','Correct — BN is a DAG','Not bipartite — any node can connect to any other','Decision trees are different structures']},
  {id:'a20',u:'5',q:'The Markov Blanket of a node X in a Bayesian Network consists of:',opts:['Only the parents of X','Only the children of X','Parents, children, and other parents of children of X','All nodes in the network'],ans:2,explain:'Markov blanket of X = Parents(X) ∪ Children(X) ∪ OtherParents(Children(X)). X is conditionally independent of ALL other nodes given its Markov blanket. Used in Gibbs sampling.',wrongs:['Parents alone do not form the Markov blanket','Children alone are not sufficient','Correct — the full Markov blanket definition','All nodes = no independence, which defeats the purpose']},
  {id:'a21',u:'1',q:'Which property makes IDDFS preferred over BFS for unknown-depth problems?',opts:['Uses more memory','Faster per node','Linear space complexity O(bd)','Always finds solution faster'],ans:2,explain:'IDDFS has DFS-like space complexity O(bd), much better than BFS\'s O(b^d). It is complete and optimal (equal costs) like BFS. Repeated work in IDDFS is small since most nodes are at deepest level.',wrongs:['IDDFS uses much LESS memory — that is the advantage','Speed per node is similar','Correct — O(bd) space vs O(b^d) for BFS','Not necessarily faster in time, but much more memory-efficient']},
  {id:'a22',u:'2',q:'Arc consistency in CSP ensures that:',opts:['All variables have the same domain size','For every pair (Xi,Xj), every value in Di has at least one compatible value in Dj','All constraints are satisfied','The problem has a unique solution'],ans:1,explain:'Arc consistency (AC-3): for every arc Xi→Xj, every value in Di must have at least one consistent value in Dj. If a value in Di has no support in Dj, it is removed from Di.',wrongs:['Domain sizes can differ after arc consistency','Correct — this is the arc consistency definition','AC does not guarantee full solution','AC prunes domains but does not guarantee uniqueness']},
  {id:'a23',u:'3',q:'Skolemization replaces:',opts:['Universal quantifiers with constants','Existential quantifiers with Skolem constants/functions','All variables with constants','Predicates with functions'],ans:1,explain:'Skolemization: eliminate existential quantifiers by introducing new Skolem constants (if no surrounding ∀) or Skolem functions (if under ∀). ∃x P(x) → P(c), and ∀y∃x P(x,y) → ∀y P(f(y),y).',wrongs:['UI eliminates universals by substitution','Correct — Skolemization eliminates existentials','That would eliminate all variables — wrong','Predicates stay as predicates; functions replace existential witnesses']},
  {id:'a24',u:'4',q:'The Closed-World Assumption in planning means:',opts:['The world never changes','Any atom not explicitly stated is assumed FALSE','All goals are achievable','Actions have no preconditions'],ans:1,explain:'Closed-World Assumption (CWA): any fact not stated in the knowledge base is assumed to be FALSE. Simplifies reasoning — no need to explicitly negate everything not in KB.',wrongs:['CWA is about truth of atoms, not change','Correct — unstated atoms are assumed false','CWA doesn\'t say anything about achievability','Preconditions are still required in PDDL']},
  {id:'a25',u:'5',q:'Rejection sampling is inefficient because:',opts:['It requires too many variables','Most samples are rejected when evidence is unlikely','It cannot handle continuous variables','It produces biased estimates'],ans:1,explain:'Rejection sampling generates prior samples then rejects those inconsistent with evidence. If P(evidence) is small, nearly all samples are rejected → very few useful samples → inefficient.',wrongs:['Variable count affects accuracy, not fundamental efficiency','Correct — low P(evidence) → massive rejection rate','With discretization, continuous vars are handleable','Rejection sampling is unbiased (just inefficient)']},
  {id:'a26',u:'1',q:'Greedy Best-First Search is not optimal because:',opts:['It does not use a heuristic','It ignores g(n) and only uses h(n)','It always expands the goal first','It uses too much memory'],ans:1,explain:'Greedy BFS uses only h(n) (heuristic to goal), ignoring g(n) (cost so far). This can lead to long or suboptimal paths that happen to "look" close to goal by heuristic, while cheaper paths are ignored.',wrongs:['Greedy uses heuristic h(n)','Correct — no path cost g(n) considered','Not guaranteed to expand goal first','Greedy can actually use less memory than A*']},
  {id:'a27',u:'2',q:'Horn clauses are important because inference with them is:',opts:['NP-Complete','Exponential','Linear time','Undecidable'],ans:2,explain:'Forward and backward chaining with Horn clause KBs runs in LINEAR TIME O(n). This is a major computational advantage over general propositional resolution. Prolog exploits this property.',wrongs:['General SAT is NP-Complete, Horn SAT is polynomial','Exponential = general inference, not Horn','Correct — Horn clause inference is O(n) linear','Horn inference is complete and decidable']},
  {id:'a28',u:'3',q:'Resolution in FOL requires converting all sentences to:',opts:['Disjunctive Normal Form (DNF)','Horn Clause form','Conjunctive Normal Form (CNF)','First-order Horn form only'],ans:2,explain:'FOL resolution requires CNF: a conjunction of clauses, where each clause is a disjunction of literals. Converting FOL to CNF involves: eliminate ⟺, ⇒, move ¬ inward, Skolemize, drop ∀, distribute ∨ over ∧.',wrongs:['DNF is not used for resolution','Horn form is a special case; general resolution needs CNF','Correct — resolution requires CNF','Resolution works on full FOL in CNF, not just Horn']},
  {id:'a29',u:'4',q:'Mutex relations in planning graphs indicate:',opts:['Actions that must be executed together','Actions that cannot execute simultaneously (or literals that cannot both be true)','The minimum cost path','Actions with identical preconditions'],ans:1,explain:'Mutex = mutually exclusive. Two actions are mutex if they cannot execute simultaneously (inconsistent effects, interference, or competing needs). Two literals are mutex if they cannot both be true. GRAPHPLAN uses mutex to ensure valid plans.',wrongs:['Mutex means they CANNOT happen together — opposite','Correct — mutually exclusive actions or literals','Planning graphs don\'t directly give costs','Same preconditions doesn\'t make actions mutex']},
  {id:'a30',u:'5',q:'Dempster-Shafer theory differs from Bayesian probability in that:',opts:['D-S uses directed graphs','D-S assigns belief to sets and explicitly handles ignorance','D-S only works for binary variables','D-S requires full joint distribution'],ans:1,explain:'D-S assigns belief mass to SETS of outcomes (not just atomic events). It explicitly distinguishes between: lack of evidence (ignorance), belief, and plausibility. Bayesian assigns probabilities to all outcomes (must sum to 1 — no ignorance).',wrongs:['Bayesian networks use directed graphs; D-S is not graph-based','Correct — D-S handles ignorance differently from Bayesian','D-S works for any discrete domain','D-S does not require full joint distribution']},
];
