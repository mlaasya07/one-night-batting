name: Update catalogue

# Rebuilds data.js and COLORS.md after changes land on main.
# `main` is protected, so instead of pushing directly this opens a pull request
# ("Update catalogue") for the owner to merge. If nothing changed, nothing happens.
#
# One-time setting needed: Repo -> Settings -> Actions -> General -> Workflow permissions
#   -> tick "Allow GitHub Actions to create and approve pull requests".
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data.js'
      - 'COLORS.md'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild data.js and COLORS.md
        run: |
          node tools/build-data.mjs
          node tools/build-colors.mjs

      - name: Open a pull request if anything changed
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            data.js
            COLORS.md
          branch: auto/update-catalogue
          delete-branch: true
          commit-message: "Update catalogue"
          title: "Update catalogue"
          body: "Automated rebuild of `data.js` and `COLORS.md` from the current folders (tools/build-data.mjs, tools/build-colors.mjs)."