name: Update catalogue

# Rebuilds data.js and COLORS.md whenever files are pushed, and commits them back if they changed.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data.js'
      - 'COLORS.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history, so each file's first-added date (NEW badge) is correct

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild data.js and COLORS.md
        run: |
          node tools/build-data.mjs
          node tools/build-colors.mjs

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data.js COLORS.md)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.js COLORS.md
            git commit -m "Update catalogue [skip ci]"
            git push
          else
            echo "Catalogue already up to date."
          fi
